[project]
name = "careercoach-api"
version = "0.1.0"
description = "CareerCoach AI · FastAPI + LangGraph backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "patient-Zero-0" },
    { name = "k4392" },
]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.18,<0.1",
    "python-jose[cryptography]>=3.3,<4.0",
    "structlog>=24.4,<25.0",
    "sentry-sdk[fastapi]>=2.18,<3.0",
    "langgraph>=0.2,<0.3",
    "langfuse>=2.50,<3.0",
    "tzdata>=2024.2; platform_system == 'Windows'",
    "pillow>=11.0,<12.0",
    "qrcode[pil]>=8.0,<9.0",
    "websockets>=13,<14",
    "aiosmtplib>=5.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<0.29",
    "types-python-jose>=3.3,<4.0",
    "pyyaml>=6.0,<7.0",
    "types-pyyaml>=6.0,<7.0",
    "types-qrcode>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — Prettier-style; we set line-length=100
    "S101",  # asserts allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
# FastAPI's Query/Path/Body must live in argument defaults; B008 is wrong here.
# RUF001/002/003 flag Chinese full-width punctuation that we use intentionally
# in user-facing examples and copy.
"app/routes/**/*.py" = ["B008", "RUF001", "RUF002", "RUF003"]
"app/schemas/**/*.py" = ["RUF001", "RUF002", "RUF003"]
# Agent prompts are intentionally Chinese user-facing copy, and `PASS`
# is a Verdict enum value (not a credential).
"app/agents/**/*.py" = ["RUF001", "RUF002", "RUF003", "S105"]
# Moderation service holds Chinese red-line resource titles + sample copy.
# B008 covers the auth dependency module, where `Depends()` in argument
# defaults is the canonical FastAPI dependency pattern (same exception
# the route layer uses).
"app/services/**/*.py" = ["B008", "RUF001", "RUF002", "RUF003"]
"tests/test_moderation_*.py" = ["RUF001", "RUF002", "RUF003"]
# Sessions tests carry Chinese fixtures and implement `LLMProvider` stubs that
# require the `timeout=` parameter to match the protocol signature.
"tests/test_sessions_*.py" = ["RUF001", "RUF002", "RUF003", "ASYNC109"]
# Voice-turn tests carry Chinese fixtures and stub the ASRProvider, whose
# `transcribe_stream` contract requires the `timeout=` parameter.
"tests/test_voice_*.py" = ["RUF001", "RUF002", "RUF003", "ASYNC109"]
"tests/test_scenarios_*.py" = ["RUF001", "RUF002", "RUF003"]
# Character Engine L1 tests assert against Chinese descriptor strings
# (你的性格底色：, 对手画像：) so they need the same carveout as the
# sibling test_scenarios_* / test_sessions_* patterns.
"tests/test_character_vector.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_turn_service_prompt_injection.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_mood_arbiter.py" = ["RUF001", "RUF002", "RUF003", "ASYNC109"]
"tests/test_sessions_character_vector_e2e.py" = ["RUF001", "RUF002", "RUF003", "ASYNC109"]
# Custom-scenario tests carry Chinese scenario descriptions + sample copy,
# and stub LLMProvider with the contract-required `timeout=` parameter.
"tests/test_custom_scenario_*.py" = ["RUF001", "RUF002", "RUF003", "ASYNC109"]
"tests/test_sharecards_*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_auth_*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_email_*.py" = ["RUF001", "RUF002", "RUF003"]
# Spike runner has Chinese prompts + report copy using full-width
# punctuation and × / – for human readability.
"scripts/llm_spike/**/*.py" = ["RUF001", "RUF002", "RUF003"]
# Moderation eval CLI emits a Chinese markdown report.
"scripts/moderation_eval/**/*.py" = ["RUF001", "RUF002", "RUF003"]
# Nightly LLM regression: judge prompt + scenario dataset are Chinese
# user-facing copy with full-width punctuation by design.
"scripts/llm_regression/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_llm_regression_*.py" = ["RUF001", "RUF002", "RUF003"]
# `timeout=` is part of the LLMProvider contract (foundation §3.3.4),
# not a reinvention of asyncio.timeout — adapters must accept it directly.
"app/llm/**/*.py" = ["ASYNC109"]
"tests/test_llm_*.py" = ["ASYNC109"]
"tests/test_agents_*.py" = ["ASYNC109"]
# Same rationale for ASR — `timeout=` is part of the ASRProvider
# contract so adapters can apply it end-to-end across the streaming
# transcribe loop.
"app/asr/**/*.py" = ["ASYNC109"]
"tests/test_asr_*.py" = ["ASYNC109"]
# TTS mirrors ASR — `timeout=` is part of the TTSProvider contract so
# adapters can apply it end-to-end across the streaming synthesize loop.
"app/tts/**/*.py" = ["ASYNC109"]
"tests/test_tts_*.py" = ["ASYNC109", "RUF001", "RUF002", "RUF003"]
# Copilot WS tests speak Chinese in coach-prompt fixtures and stub
# LLMProvider with the contract-required `timeout=` parameter.
"tests/test_copilot_*.py" = ["RUF001", "RUF002", "RUF003", "ASYNC109"]
# Health readiness test stubs LLMProvider for dep-injection — the
# `timeout=` parameter is contract, not a misuse of asyncio.timeout.
"tests/test_health.py" = ["ASYNC109"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "scripts/llm_spike", "scripts/moderation_eval"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: hits docker compose services (postgres/redis/qdrant); auto-skips when unreachable",
]
