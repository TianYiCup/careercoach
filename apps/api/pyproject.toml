[project]
name = "careercoach-api"
version = "0.1.0"
description = "CareerCoach AI · FastAPI + LangGraph backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "patient-Zero-0" },
    { name = "k4392" },
]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.18,<0.1",
    "python-jose[cryptography]>=3.3,<4.0",
    "structlog>=24.4,<25.0",
    "sentry-sdk[fastapi]>=2.18,<3.0",
    "langgraph>=0.2,<0.3",
    "tzdata>=2024.2; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<0.29",
    "types-python-jose>=3.3,<4.0",
    "pyyaml>=6.0,<7.0",
    "types-pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — Prettier-style; we set line-length=100
    "S101",  # asserts allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
# FastAPI's Query/Path/Body must live in argument defaults; B008 is wrong here.
# RUF001/002/003 flag Chinese full-width punctuation that we use intentionally
# in user-facing examples and copy.
"app/routes/**/*.py" = ["B008", "RUF001", "RUF002", "RUF003"]
"app/schemas/**/*.py" = ["RUF001", "RUF002", "RUF003"]
# Agent prompts are intentionally Chinese user-facing copy, and `PASS`
# is a Verdict enum value (not a credential).
"app/agents/**/*.py" = ["RUF001", "RUF002", "RUF003", "S105"]
# `timeout=` is part of the LLMProvider contract (foundation §3.3.4),
# not a reinvention of asyncio.timeout — adapters must accept it directly.
"app/llm/**/*.py" = ["ASYNC109"]
"tests/test_llm_*.py" = ["ASYNC109"]
"tests/test_agents_*.py" = ["ASYNC109"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: hits docker compose services (postgres/redis/qdrant); auto-skips when unreachable",
]
