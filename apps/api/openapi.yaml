        description: Filter to a single user. Omit for tenant-wide rollup.
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive lower bound on `created_at`. ISO-8601, timezone-aware.
          title: Since
        description: Inclusive lower bound on `created_at`. ISO-8601, timezone-aware.
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Exclusive upper bound on `created_at` (half-open `[since, until)` matches /moderation-events
            + /token-cost).
          title: Until
        description: Exclusive upper bound on `created_at` (half-open `[since, until)` matches /moderation-events
