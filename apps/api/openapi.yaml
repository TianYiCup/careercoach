        description: The user whose daily spend to roll up.
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 1
          description: Number of UTC-day buckets to return, ending today. 1 = today only; default 7 =
            week view; max 90.
