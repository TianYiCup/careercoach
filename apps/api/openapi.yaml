      description: Aggregates `moderation_events` over a window. Returns totals plus by-verdict (always
        4 entries in canonical order), by-context, by-category and by-backend breakdowns. `by_category`
        counts each row once per category it carries — the reading is 'how often did category X fire',
        not 'how many single-category rows'.
