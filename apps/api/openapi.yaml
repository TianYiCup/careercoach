          - 5
        real_user_certified:
          type: boolean
          title: Real User Certified
          description: Derived from `certification_count >= 5` (PRD §3.0.5 D). Kept on the response for
            backwards compatibility with existing clients that branch on the boolean.
          examples:
          - true
      type: object
      required:
      - id
      - title
      - category
      - difficulty
      - background
      - certification_count
      - real_user_certified
      title: ScenarioSummary
    Score:
      properties:
        aura:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Aura
          description: 气场 / presence.
        logic:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Logic
        emotion:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Emotion
          description: Emotional regulation.
        professionalism:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Professionalism
        goal_achieve:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Goal Achieve
          description: How close user got to user_goal.
        highlights:
          type: string
          title: Highlights
          description: K's praise — what the user nailed.
        failures:
          type: string
          title: Failures
          description: K's call-outs — where the user slipped.
        result:
          type: string
          enum:
          - shenfeng
          - guolu
          - fanche
          title: Result
          description: 封神 ≥ 8 / 路过 5–7 / 翻车 < 5. Drives Mascot expression and ShareCard gradient.
          examples:
          - guolu
      type: object
      required:
      - aura
      - logic
      - emotion
      - professionalism
      - goal_achieve
      - highlights
      - failures
      - result
      title: Score
      description: Per-session scorecard, returned on POST /v1/sessions/{id}/end.
    SessionShareCardRequest:
      properties:
        include_qrcode:
          type: boolean
          title: Include Qrcode
          description: Render the bottom-right QR code that deep-links back to the app. Defaults to false
            — many users prefer screenshot-clean cards.
          default: false
        user_caption_override:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: User Caption Override
          description: Optional user-edited one-liner replacing K's default verdict copy. Server still
            re-runs moderation (§7.8) before baking it into the PNG.
          examples:
          - 今天嘴硬了一把
      type: object
      title: SessionShareCardRequest
      description: 'Body of POST /v1/sharecards/session/{session_id}.


        `session_id` itself rides in the URL path so frontend can use

        `useShareCardForSession(id)` patterns without juggling bodies.'
    SetVibeRequest:
      properties:
        vibe:
          type: string
          enum:
          - fire
          - tired
          - anxious
          - excited
          - meh
          title: Vibe
          description: Today's mood. One of fire / tired / anxious / excited / meh.
          examples:
          - fire
      type: object
      required:
      - vibe
      title: SetVibeRequest
      description: '`POST /v1/vibe/today` body — PRD §7.11 `{ "vibe": "fire" }`.'
    ShareCardResponse:
      properties:
        card_id:
          type: string
          title: Card Id
          description: Stable opaque id, also used as the storage object key. Prefix `card_` — distinct
            from `sc_` scenario ids and `ses_` session ids so log grep is unambiguous.
          examples:
          - card_018f3a8b1c2d7e3a
        type:
          type: string
          enum:
          - session
          - weekly
          - wrapped
          title: Type
        png_url:
          type: string
          title: Png Url
          description: 1080×1920 PNG URL. Presigned — frontend should re-request the card if the URL has
            expired. For `wrapped` this URL equals `pages[0]` and is the cover used by share-preview cards
            (OG / WeChat).
          examples:
          - https://cdn.example.com/sharecards/card_018f3a8b1c2d7e3a.png
        pages:
          items:
            type: string
          type: array
          title: Pages
          description: All pages in display order. Empty for `session` and `weekly`; for `wrapped` contains
            6 URLs where `pages[0]` IS the cover and equals `png_url` — frontend should render `pages`
            only and not show the cover twice.
          examples:
          - - https://cdn.example.com/sharecards/card_xxx/p0_cover.png
            - https://cdn.example.com/sharecards/card_xxx/p1_count.png
            - https://cdn.example.com/sharecards/card_xxx/p2_opponent.png
            - https://cdn.example.com/sharecards/card_xxx/p3_shenfeng.png
            - https://cdn.example.com/sharecards/card_xxx/p4_fanche.png
            - https://cdn.example.com/sharecards/card_xxx/p5_letter.png
        share_links:
          $ref: '#/components/schemas/ShareLinks'
        generated_at:
          type: string
          format: date-time
          title: Generated At
          description: UTC timestamp at which the PNG was rendered.
          examples:
          - '2026-05-12T13:45:00Z'
      type: object
      required:
      - card_id
      - type
      - png_url
      - share_links
      - generated_at
      title: ShareCardResponse
      description: '200 response shared by all three POSTs.


        A `wrapped` card carries 6 PNGs (one per page); `png_url` always

        points at `pages[0]` (the cover, which doubles as the OG share

        preview). For `session` / `weekly` the card is a single image and

        `pages` is empty.'
    ShareLinks:
      properties:
        wechat:
          type: string
          title: Wechat
          description: WeChat share deep link (weixin://...). Frontend opens via wx-sdk.
          examples:
          - weixin://dl/share?card=card_018f3a8b1c2d7e3a
        xiaohongshu:
          type: string
          title: Xiaohongshu
          description: Xiaohongshu share intent URL.
          examples:
          - https://www.xiaohongshu.com/share?img=card_018f3a8b1c2d7e3a
        save_local:
          type: string
          title: Save Local
          description: Direct PNG URL for save-to-album. Same origin as `png_url`.
          examples:
          - https://cdn.example.com/sharecards/card_018f3a8b1c2d7e3a.png
      type: object
      required:
      - wechat
      - xiaohongshu
      - save_local
      title: ShareLinks
      description: 'One-tap targets we render under the saved card.


        `save_local` is the raw PNG URL the client uses to drop the image

        into the user''s photo roll. `wechat` / `xiaohongshu` are deep-link

        URIs that pre-fill platform share sheets — they may carry a short

        UTM tag so analytics can attribute virality, but they MUST NOT

        leak PII (user_id, phone, etc.).'
    SmsSendRequest:
      properties:
        phone:
          type: string
          pattern: ^1[3-9]\d{9}$
          title: Phone
          description: Mainland China mobile number, 11 digits, no country prefix.
          examples:
          - '13800138000'
      type: object
      required:
      - phone
      title: SmsSendRequest
    SmsSendResponse:
      properties:
        ttl:
          type: integer
          minimum: 1.0
          title: Ttl
          description: Seconds until the user may request another code. Hardcoded 60s in v0.1.
          examples:
          - 60
      type: object
      required:
      - ttl
      title: SmsSendResponse
    SmsVerifyRequest:
      properties:
        phone:
          type: string
          pattern: ^1[3-9]\d{9}$
          title: Phone
          examples:
          - '13800138000'
        code:
          type: string
          pattern: ^\d{6}$
          title: Code
          description: 6-digit verification code received by SMS.
          examples:
          - '123456'
      type: object
      required:
      - phone
      - code
      title: SmsVerifyRequest
    SmsVerifyResponse:
      properties:
        token:
          type: string
          title: Token
          description: 'JWT bearer token. Pass as `Authorization: Bearer <token>`.'
          examples:
          - eyJhbGciOiJIUzI1NiJ9...
        user:
          $ref: '#/components/schemas/UserPublic'
      type: object
      required:
      - token
      - user
      title: SmsVerifyResponse
    SseEventEnvelope:
      properties:
        frame:
          oneOf:
          - $ref: '#/components/schemas/_UserTranscribedFrame'
          - $ref: '#/components/schemas/_OpponentDeltaFrame'
          - $ref: '#/components/schemas/_OpponentDoneFrame'
          - $ref: '#/components/schemas/_CoachHintFrame'
          - $ref: '#/components/schemas/_MetaFrame'
          - $ref: '#/components/schemas/_ModerationFrame'
          title: Frame
          description: One frame of a sandbox turn SSE stream (/turns or /voice). The `event` tag selects
            the matching `data` shape.
          discriminator:
            propertyName: event
            mapping:
              coach.hint: '#/components/schemas/_CoachHintFrame'
              meta: '#/components/schemas/_MetaFrame'
              moderation: '#/components/schemas/_ModerationFrame'
              opponent.delta: '#/components/schemas/_OpponentDeltaFrame'
              opponent.done: '#/components/schemas/_OpponentDoneFrame'
              user.transcribed: '#/components/schemas/_UserTranscribedFrame'
      type: object
      required:
      - frame
      title: SseEventEnvelope
      description: Wrapper that lets FastAPI register `SseEventFrame` in components/schemas.
    StreakResponse:
      properties:
        current_days:
          type: integer
          minimum: 0.0
          title: Current Days
          description: Consecutive practice days up to and including today.
          examples:
          - 12
        max_days:
          type: integer
          minimum: 0.0
          title: Max Days
          description: All-time best streak.
          examples:
          - 27
      type: object
      required:
      - current_days
      - max_days
      title: StreakResponse
      description: '`GET /v1/streak` — drives the home screen''s StreakFire counter.'
    TTSSynthesizeRequest:
      properties:
        text:
          type: string
          maxLength: 200
          minLength: 1
          title: Text
          description: Mandarin text to synthesize. Subject to red-line moderation before the provider
            sees it (PRD §3.0.5).
          examples:
          - 下一句可以这样说：先问对方时间方便不方便，再切正题。
        voice:
          type: string
          const: k-warm
          title: Voice
          description: Stable voice id. v1 ships only `k-warm` (warm Mandarin female, matching Coach K's
            '嘴硬心软' tone). Future voices append here.
          default: k-warm
          examples:
          - k-warm
        audio_format:
          type: string
          enum:
          - mp3
          - ogg
          - wav
          title: Audio Format
          description: Container for the response body. `mp3` plays everywhere.
          default: mp3
          examples:
          - mp3
      type: object
      required:
      - text
      title: TTSSynthesizeRequest
      description: '`POST /v1/tts/synthesize` body.'
    TokenCostBreakdownEntry:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
        call_count:
          type: integer
          minimum: 0.0
          title: Call Count
        prompt_tokens:
          type: integer
          minimum: 0.0
          title: Prompt Tokens
        completion_tokens:
          type: integer
          minimum: 0.0
          title: Completion Tokens
        total_tokens:
          type: integer
          minimum: 0.0
          title: Total Tokens
      additionalProperties: false
      type: object
      required:
      - key
      - call_count
      - prompt_tokens
      - completion_tokens
      - total_tokens
      title: TokenCostBreakdownEntry
      description: "One row in a by-model or by-surface breakdown.\n\n`key` is the grouping value:\n \
        \ * for `by_model` — the vendor model id verbatim (e.g.\n    `\"deepseek-chat\"`, `\"qwen-max\"\
        `)\n  * for `by_surface` — `sandbox` / `review` / `copilot` / `agent`\n\nSorted by `total_tokens`\
        \ desc (the rollup endpoint surfaces\nmost-expensive first so ops tooling renders without re-sorting)."
    TokenCostDailyEntry:
      properties:
        day:
          type: string
          format: date
          title: Day
        totals:
          $ref: '#/components/schemas/TokenCostTotals'
      additionalProperties: false
      type: object
      required:
      - day
      - totals
      title: TokenCostDailyEntry
      description: 'One UTC-day bucket in a daily time series.


        `day` serializes as `YYYY-MM-DD` (Pydantic''s default for `date`)

        — calendar boundaries are the unit the dashboard chart renders,

        keeping JSON consumers from having to slice ISO timestamps. The

        timezone is always UTC; the PRD''s display-in-Asia/Shanghai rule

        is a render-side concern, not a wire-shape one.'
    TokenCostDailyResponse:
      properties:
        user_id:
          type: string
          minLength: 1
          title: User Id
        days:
          type: integer
          maximum: 90.0
          minimum: 1.0
          title: Days
        since:
          type: string
          format: date-time
          title: Since
        until:
          type: string
          format: date-time
          title: Until
        totals:
          $ref: '#/components/schemas/TokenCostTotals'
        daily:
          items:
            $ref: '#/components/schemas/TokenCostDailyEntry'
          type: array
          title: Daily
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - user_id
      - days
      - since
      - until
      - totals
      - daily
      - generated_at
      title: TokenCostDailyResponse
      description: 'Per-day token spend over a rolling N-day window.


        `daily` always contains exactly `days` entries — one per UTC day

        in `[since, until)` — in chronological order. Days with no calls

        appear with zeroed totals so the chart line has a stable x-axis

        from day one (no gaps where the user happened to be quiet).


        `totals` is the sum across all daily buckets. Pinned invariant:

        `totals.total_tokens == sum(d.totals.total_tokens for d in daily)`.

        Without this the headline number and the chart sum can drift

        apart, and the dashboard loses trust the moment they disagree.'
    TokenCostResponse:
      properties:
        user_id:
          type: string
          minLength: 1
          title: User Id
        window:
          type: string
          enum:
          - 1d
          - 7d
          - 30d
          - all
          title: Window
        since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
        until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Until
        totals:
          $ref: '#/components/schemas/TokenCostTotals'
        by_model:
          items:
            $ref: '#/components/schemas/TokenCostBreakdownEntry'
          type: array
          title: By Model
        by_surface:
          items:
            $ref: '#/components/schemas/TokenCostBreakdownEntry'
          type: array
          title: By Surface
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - user_id
      - window
      - since
      - until
      - totals
      - by_model
      - by_surface
      - generated_at
      title: TokenCostResponse
      description: 'Per-user × per-window LLM token spend.


        `since` / `until` echo the time window the route resolved from

        the `window` query param so a downstream renderer doesn''t have

        to re-derive them. Both null when `window=all` (unbounded).


        `generated_at` is the server''s UTC timestamp at the moment the

        rollup ran — lets ops cache responses with a known freshness

        floor without parsing dashboard timing themselves.'
    TokenCostTotals:
      properties:
        call_count:
          type: integer
          minimum: 0.0
          title: Call Count
        prompt_tokens:
          type: integer
          minimum: 0.0
          title: Prompt Tokens
        completion_tokens:
          type: integer
          minimum: 0.0
          title: Completion Tokens
        total_tokens:
          type: integer
          minimum: 0.0
          title: Total Tokens
      additionalProperties: false
      type: object
      required:
      - call_count
      - prompt_tokens
      - completion_tokens
      - total_tokens
      title: TokenCostTotals
      description: Sum across the window — the headline cost numbers.
    TurnRequest:
      properties:
        content:
          type: string
          maxLength: 2000
          minLength: 1
          title: Content
          description: User's reply text. Server runs moderation BEFORE forwarding to LLM.
          examples:
          - 赵总，我周末有重要安排
      type: object
      required:
      - content
      title: TurnRequest
      description: Body for POST /v1/sessions/{id}/turns. Response is SSE — see route description.
    UpdateBirthYearRequest:
      properties:
        birth_year:
          type: integer
          maximum: 2100.0
          minimum: 1900.0
          title: Birth Year
          description: Year of birth as a 4-digit integer. Server derives `is_minor` from this; the client
            cannot self-declare it.
          examples:
          - 2003
      type: object
      required:
      - birth_year
      title: UpdateBirthYearRequest
      description: 'Set the caller''s birth year for the minor-mode gate (PRD §1.5).


        We collect year only (minimal PII) — a mid-year proxy is enough

        for the `<18` decision. Static bounds catch gross typos

        (`99999`, `0`); years beyond the current year are accepted and

        land the caller on the strict tier (`compute_is_minor` returns

        True for negative ages — fail-closed).'
    UserPublic:
      properties:
        id:
          type: string
          title: Id
          description: UUID.
          examples:
          - u_018f3a8b-1c2d-7e3a-b4f5-6c7d8e9f0a1b
        nickname:
          type: string
          title: Nickname
          examples:
          - 小苏
        persona_type:
          type: string
          enum:
          - in_school
          - intern
          - graduate
          title: Persona Type
          examples:
          - in_school
        is_minor:
          type: boolean
          title: Is Minor
          description: True if user.birthdate puts them under 18 — triggers minor mode (PRD §3.0.5 C).
          examples:
          - false
      type: object
      required:
      - id
      - nickname
      - persona_type
      - is_minor
      title: UserPublic
      description: Fields safe to surface to the client. Never include `phone` raw — masked.
    UserTranscribedEvent:
      properties:
        text:
          type: string
          title: Text
          description: Final ASR transcript of the uploaded audio.
          examples:
          - 赵总，我周末有重要安排
      type: object
      required:
      - text
      title: UserTranscribedEvent
      description: 'ASR transcript of an uploaded voice turn (PRD §7.4).


        The first frame of the `POST /sessions/{id}/voice` stream — emitted

        before any opponent reply so the UI can show the recognised text

        (US-A3: "1s 内屏幕显示 ASR 文本"). Never appears in a `POST /turns`

        stream, where the user already supplied the text.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VibeResponse:
      properties:
        vibe:
          type: string
          enum:
          - fire
          - tired
          - anxious
          - excited
          - meh
          title: Vibe
          description: The mood just recorded.
          examples:
          - fire
        logged_date:
          type: string
          format: date
          title: Logged Date
          description: Asia/Shanghai calendar date the check-in is filed under.
          examples:
          - '2026-05-20'
      type: object
      required:
      - vibe
      - logged_date
      title: VibeResponse
      description: 'Confirms the recorded check-in. The home screen uses `vibe` to

        pick 教练 K''s expression and bias scenario recommendations.'
    WeaknessItem:
      properties:
        tag:
          type: string
          title: Tag
          description: Weakness tag from the product taxonomy, e.g. 过早让步.
          examples:
          - 过早让步
        frequency:
          type: integer
          minimum: 0.0
          title: Frequency
          description: Accumulated number of times this weakness has surfaced.
          examples:
          - 4
        last_seen:
          type: string
          format: date-time
          title: Last Seen
          description: UTC timestamp the weakness was last recorded.
      type: object
      required:
      - tag
      - frequency
      - last_seen
      title: WeaknessItem
      description: One tracked communication weakness for the caller.
    WeaknessProfileResponse:
      properties:
        weaknesses:
          items:
            $ref: '#/components/schemas/WeaknessItem'
          type: array
          title: Weaknesses
          description: Tracked weaknesses, highest-frequency first. Empty until first scored session.
        recommended_scenarios:
          items:
            $ref: '#/components/schemas/ScenarioSummary'
          type: array
          title: Recommended Scenarios
          description: Scenarios to train against. v1 surfaces catalog scenarios; weakness-targeted matching
            is a follow-up.
      type: object
      title: WeaknessProfileResponse
      description: '`GET /v1/users/me/weaknesses` — the 弱点画像 (US-C3).'
    WeaknessUpdate:
      properties:
        tag:
          type: string
          title: Tag
          examples:
          - 过早让步
        delta:
          type: integer
          title: Delta
          description: Frequency delta from this session. Negative = improved.
          examples:
          - 1
      type: object
      required:
      - tag
      - delta
      title: WeaknessUpdate
    WeeklyShareCardRequest:
      properties:
        include_qrcode:
          type: boolean
          title: Include Qrcode
          description: Weekly is opt-in viral — most users glance and dismiss; Wrapped defaults the QR
            ON because that card is built to share. Flip this to true to surface the QR for users who
            do want to share.
          default: false
        week_offset:
          type: integer
          maximum: 0.0
          minimum: -12.0
          title: Week Offset
          description: 0 = the immediately preceding ISO calendar week (Mon-Sun in `Asia/Shanghai`). -1
            = the week before that, and so on, down to -12. Bounded so users can't backfill the whole
            year via this endpoint.
          default: 0
          examples:
          - 0
      type: object
      title: WeeklyShareCardRequest
      description: Body of POST /v1/sharecards/weekly. Manual trigger; cron also calls this.
    WrappedShareCardRequest:
      properties:
        include_qrcode:
          type: boolean
          title: Include Qrcode
          description: Wrapped defaults to on — virality matters.
          default: true
      type: object
      title: WrappedShareCardRequest
      description: 'Body of POST /v1/sharecards/wrapped/year/{year}.


        The year lives in the URL — body carries cosmetic toggles only.

        Empty-by-design today; if the field set grows post-v0.1 we''ll keep

        backward compatibility by adding only optional fields.'
    _CoachHintFrame:
      properties:
        event:
          type: string
          const: coach.hint
          title: Event
          default: coach.hint
        data:
          $ref: '#/components/schemas/CoachHintEvent'
      type: object
      required:
      - data
      title: _CoachHintFrame
    _MetaFrame:
      properties:
        event:
          type: string
          const: meta
          title: Event
          default: meta
        data:
          $ref: '#/components/schemas/MetaEvent'
      type: object
      required:
      - data
      title: _MetaFrame
    _ModerationFrame:
      properties:
        event:
          type: string
          const: moderation
          title: Event
          default: moderation
        data:
          $ref: '#/components/schemas/ModerationInterceptEvent'
      type: object
      required:
      - data
      title: _ModerationFrame
    _OpponentDeltaFrame:
      properties:
        event:
          type: string
          const: opponent.delta
          title: Event
          default: opponent.delta
        data:
          $ref: '#/components/schemas/OpponentDeltaEvent'
      type: object
      required:
      - data
      title: _OpponentDeltaFrame
    _OpponentDoneFrame:
      properties:
        event:
          type: string
          const: opponent.done
          title: Event
          default: opponent.done
        data:
          $ref: '#/components/schemas/OpponentDoneEvent'
      type: object
      required:
      - data
      title: _OpponentDoneFrame
    _UserTranscribedFrame:
      properties:
        event:
          type: string
          const: user.transcribed
          title: Event
          default: user.transcribed
        data:
          $ref: '#/components/schemas/UserTranscribedEvent'
      type: object
      required:
      - data
      title: _UserTranscribedFrame
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
