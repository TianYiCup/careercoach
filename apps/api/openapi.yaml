  /v1/streak:
    get:
      tags:
      - streak
      summary: Get the caller's practice streak
      description: 'A user who has never practised gets `{current_days: 0, max_days:

        0}`, not a 404. `user_id` comes from the JWT.'
      operationId: get_streak_v1_streak_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakResponse'
      security:
      - JWT: []
  /v1/personas:
    get:
      tags:
      - personas
      summary: List the 4 base opponent personas
      description: 'US-A2. The 4 personas are fixed (PRD §10.2) and returned easy →

        hard. `system_prompt` is dropped here — only `PersonaCard` fields

        cross the boundary.'
      operationId: get_personas_v1_personas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaListResponse'
  /v1/tts/synthesize:
    post:
      tags:
      - tts
      summary: Synthesize Mandarin text to streaming audio (PRD US-B2)
      description: Moderate the input, then stream synthesized audio.
      operationId: synthesize_audio_v1_tts_synthesize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSSynthesizeRequest'
        required: true
      responses:
        '200':
          description: Audio bytes streamed in the requested container. First byte typically arrives <
            1.5s; total duration scales with text length.
          content:
            application/json:
              schema: {}
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: '`AGE_REQUIRED` if the JWT lacks `age_set=true`; `MINOR_FORBIDDEN` if the caller
            is under 18. PRD §1.5 / R-15.'
        '422':
          description: '`TTS_INPUT_BLOCKED` if the text fails red-line moderation (PRD §3.0.5); validation
            errors otherwise.'
        '503':
          description: '`TTS_UNAVAILABLE` when the configured provider(s) cannot synthesize — vendor outage,
            auth misconfig, or timeout.'
      security:
      - JWT: []
components:
  schemas:
    Body_post_voice_turn_v1_sessions__session_id__voice_post:
      properties:
        audio:
          type: string
          format: binary
          title: Audio
          description: 16kHz wav/opus utterance (PRD §7.4).
      type: object
      required:
      - audio
      title: Body_post_voice_turn_v1_sessions__session_id__voice_post
    CoachHintEvent:
      properties:
        safe:
          type: string
          title: Safe
          description: 稳如老狗 🐶 — low-risk reply.
          examples:
          - 可以反问 deadline，让对方先暴露底牌
        aggressive:
          type: string
          title: Aggressive
          description: 正面刚 🔥 — direct push-back.
          examples:
          - 直接质疑加班合理性
        humor:
          type: string
          title: Humor
          description: 整活儿 🤡 — humor / deflection.
          examples:
          - 用 '离婚' 当借口
      type: object
      required:
      - safe
      - aggressive
      - humor
      title: CoachHintEvent
      description: 'Three-tier coach suggestions surfaced after the opponent finishes (design-spec §6).


        All three tiers are returned together so the UI can render the HintCardV2

        pill switcher without an extra round-trip.'
    CreateCopilotSessionRequest:
      properties:
        scenario_hint:
          type: string
          maxLength: 200
          minLength: 1
          title: Scenario Hint
          description: Free-text scenario hint, e.g. '面试谈薪'.
          examples:
          - 面试谈薪
        privacy_level:
          type: string
          enum:
          - standard
          - high
          title: Privacy Level
          description: '`high` enables on-device ASR + redaction (US-B3, v2). v0.1 accepts the field but
            does not act on it.'
          default: standard
          examples:
          - high
      type: object
      required:
      - scenario_hint
      title: CreateCopilotSessionRequest
      description: 'Mirrors PRD §7.5 — `{ "scenario_hint": "...", "privacy_level": "..." }`.


        `privacy_level=high` is the future on-device-ASR + redaction path

        (US-B3). v0.1 only validates the shape; the handler returns 501.'
    CreateCopilotSessionResponse:
      properties:
        copilot_id:
          type: string
          title: Copilot Id
          examples:
          - cop_018f3a8b1c2d7e3a
        ws_url:
          type: string
          title: Ws Url
          description: WebSocket URL the client connects to for audio chunks + hints. v0.1 placeholder
            — v1 will use SSE over the same scheme.
          examples:
          - wss://realtime.careercoach.ai/copilot/cop_018f3a8b1c2d7e3a
      type: object
      required:
      - copilot_id
      - ws_url
      title: CreateCopilotSessionResponse
      description: 'Placeholder so OpenAPI''s 200 row points at a real schema. The

        v0.1 stub never returns 200 — the handler raises 501 — but the

        type is locked here so B''s codegen can already stub a client.'
    CreateReviewUploadRequest:
      properties:
        text:
          type: string
          maxLength: 5000
          minLength: 1
          title: Text
          description: Conversation transcript pasted as text. PRD §3.3 caps at 5000 chars; longer payloads
            are 422.
          examples:
          - '对方：你周末有空吗？

            我：有事，下次约。'
      type: object
      required:
      - text
      title: CreateReviewUploadRequest
      description: 'Text-only review upload — PRD §3.3 US-C1 L4 (5000 字 ≤ 2s).


        v0.1 intentionally has no `images` / `audio` fields. Adding those

        on the v2 multipart path is a separate route operation, not an

        extension of this body — keeping JSON-only here lets B keep the

        `apiClient.post()` codepath instead of branching to FormData.'
    CreateReviewUploadResponse:
      properties:
        upload_id:
          type: string
          title: Upload Id
          examples:
          - up_018f3a8b1c2d7e3a
        status:
          type: string
          enum:
          - processing
          - done
          - failed
          title: Status
          description: Analysis state. Today's sync flow returns `done` or `failed` directly. `processing`
            is reserved for the future async path.
          examples:
          - done
      type: object
      required:
      - upload_id
      - status
      title: CreateReviewUploadResponse
      description: 'POST response — minimal envelope; full record lives on the GET route.


        `status` reflects the synchronous analysis outcome (v0 today blocks

        on the LLM call). When the queue handoff lands (A-13+), this will

        return `processing` immediately and the client polls the GET route.

        The shape stays identical so B''s client doesn''t churn.'
    CreateSessionRequest:
      properties:
        mode:
          type: string
          enum:
          - sandbox
          - copilot
          - review
          title: Mode
          description: v0.1 only ships sandbox.
          examples:
          - sandbox
        scenario_id:
          type: string
          title: Scenario Id
          examples:
          - sc_001
        persona_id:
          type: string
          title: Persona Id
          examples:
          - p_hard
        user_goal:
          type: string
          maxLength: 200
          title: User Goal
          description: What the user wants to achieve in this practice round.
          examples:
          - 保住周末，不得罪老板
      type: object
      required:
      - mode
      - scenario_id
      - persona_id
      - user_goal
      title: CreateSessionRequest
    CreateSessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          examples:
          - ses_018f3a8b1c2d7e3a
        opening_line:
          type: string
          title: Opening Line
          description: Opponent's first line, generated server-side from scenario + persona.
          examples:
          - 小林啊，这个周末项目得加个班，应该没问题吧？
      type: object
      required:
      - session_id
      - opening_line
      title: CreateSessionResponse
    CustomScenarioRequest:
      properties:
        description:
          type: string
          maxLength: 1000
          minLength: 30
          title: Description
          description: 'Free-text scenario description. US-A1: ≥ 30 chars to submit, capped at 1000.'
          examples:
          - 我想练习向房东要求退还押金，但租房合同里关于押金的条款写得很模糊。
      type: object
      required:
      - description
      title: CustomScenarioRequest
      description: '`POST /v1/scenarios/custom` body — PRD §7.3 / US-A1.'
    CustomScenarioResponse:
      properties:
        scenario_id:
          type: string
          title: Scenario Id
          examples:
          - sc_custom_a1b2c3d4e5f6
        title:
          type: string
          title: Title
          examples:
          - 向房东要求退还押金
        background:
          type: string
          title: Background
          description: The practice scenario's background.
        persona_title:
          type: string
          title: Persona Title
          description: Display name of the opponent persona.
        opening_line:
          type: string
          title: Opening Line
          description: The opponent's first line of the practice.
      type: object
      required:
      - scenario_id
      - title
      - background
      - persona_title
      - opening_line
      title: CustomScenarioResponse
      description: 'The created scenario. `scenario_id` is immediately usable as the

        `scenario_id` for `POST /v1/sessions`.'
    EndSessionResponse:
      properties:
        score:
          $ref: '#/components/schemas/Score'
        weakness_updates:
          items:
            $ref: '#/components/schemas/WeaknessUpdate'
          type: array
          title: Weakness Updates
      type: object
      required:
      - score
      title: EndSessionResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        env:
          type: string
          title: Env
      type: object
      required:
      - status
      - version
      - env
      title: HealthResponse
    LLMCallEntry:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
          description: UUID hex of the llm_calls row.
        trace_id:
          type: string
          minLength: 1
          title: Trace Id
        user_id:
          type: string
          minLength: 1
          title: User Id
        surface:
          type: string
          enum:
          - sandbox
          - review
          - copilot
          - agent
          title: Surface
        model:
          type: string
          minLength: 1
          title: Model
          description: Vendor model id (e.g. `deepseek-chat`).
        prompt_tokens:
          type: integer
          minimum: 0.0
          title: Prompt Tokens
        completion_tokens:
          type: integer
          minimum: 0.0
          title: Completion Tokens
        total_tokens:
          type: integer
          minimum: 0.0
          title: Total Tokens
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - trace_id
      - user_id
      - surface
      - model
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - created_at
      title: LLMCallEntry
      description: 'One LLM call as it appears in the ops tail.


        `id` and `trace_id` together let ops jump from this drill-down

        into Langfuse to inspect the prompt and the response. Token

        counts mirror the `llm_calls` schema 1:1 — there''s no content

        field by construction (we never persist the prompt/response in

        our own table; that lives in Langfuse).'
    LLMCallsResponse:
      properties:
        since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
        until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Until
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: Echoes the user_id filter when one was applied. Null = unfiltered.
        surface:
          anyOf:
          - type: string
            enum:
            - sandbox
            - review
            - copilot
            - agent
          - type: 'null'
          title: Surface
          description: Echoes the surface filter when one was applied.
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Echoes the model filter when one was applied.
        limit:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Limit
        count:
          type: integer
          minimum: 0.0
          title: Count
        calls:
          items:
            $ref: '#/components/schemas/LLMCallEntry'
          type: array
          title: Calls
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - since
      - until
      - limit
      - count
      - calls
      - generated_at
      title: LLMCallsResponse
      description: 'Page of recent LLM calls, newest first.


        `since` / `until` / `user_id` / `surface` / `model` echo the

        resolved filters so a renderer doesn''t have to re-derive them

        (and so a downstream cache key can be built off the response

        alone). `limit` is the cap the route applied; `count` is how

        many rows actually came back (≤ limit).'
    MetaEvent:
      properties:
        turns_used:
          type: integer
          minimum: 0.0
          title: Turns Used
          examples:
          - 5
        turns_left:
          type: integer
          minimum: 0.0
          title: Turns Left
          examples:
          - 25
      type: object
      required:
      - turns_used
      - turns_left
      title: MetaEvent
      description: Quota / meter update. Fires after each turn so the UI can re-render the counter.
    ModerationCheckRequest:
      properties:
        content:
          type: string
          maxLength: 8000
          minLength: 1
          title: Content
          description: Raw text to score. Caller MUST NOT pre-filter — moderation owns the decision.
        context:
          type: string
          enum:
          - user_input
          - ai_output
          - scenario_custom
          title: Context
          description: Where the content came from. Drives different sensitivity tables.
          examples:
          - user_input
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Optional — present when content is part of a Session/Turn.
      type: object
      required:
      - content
      - context
      title: ModerationCheckRequest
    ModerationCheckResponse:
      properties:
        verdict:
          type: string
          enum:
          - allow
          - warn
          - redirect
          - block
          title: Verdict
          description: allow = pass / warn = soft notice / redirect = surface resource / block = stop.
        categories:
          items:
            type: string
            enum:
            - self_harm
            - violence
            - loan
            - harassment
            - political
            - other
          type: array
          title: Categories
          description: Categories triggered. Empty when verdict == 'allow'.
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          description: Confidence in [0,1]. Higher = more sure the content is unsafe.
        redirect_resource:
          anyOf:
          - $ref: '#/components/schemas/RedirectResource'
          - type: 'null'
          description: Present iff verdict == 'redirect'. Null otherwise.
        trace_id:
          type: string
          title: Trace Id
          description: Echoes the request trace id for log correlation.
      type: object
      required:
      - verdict
      - score
      - trace_id
      title: ModerationCheckResponse
    ModerationEventEntry:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
          description: UUID hex of the audit row.
        user_id:
          type: string
          minLength: 1
          title: User Id
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Set when the moderation call came from inside a Session/Turn.
        content_hash:
          type: string
          maxLength: 64
          minLength: 64
          title: Content Hash
          description: SHA-256 hex of the raw content. Raw text is never returned.
        content_length:
          type: integer
          minimum: 0.0
          title: Content Length
          description: Length of the original UTF-8 string — lets ops see size without the body.
        context:
          type: string
          enum:
          - user_input
          - ai_output
          - scenario_custom
          title: Context
        verdict:
          type: string
          enum:
          - allow
          - warn
          - redirect
          - block
          title: Verdict
        categories:
          items:
            type: string
            enum:
            - self_harm
            - violence
            - loan
            - harassment
            - political
            - other
          type: array
          title: Categories
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        backend:
          type: string
          minLength: 1
          title: Backend
          description: Which backend produced the decision (e.g. `aliyun`, `local_dict`).
        trace_id:
          type: string
          minLength: 1
          title: Trace Id
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - user_id
      - content_hash
      - content_length
      - context
      - verdict
      - categories
      - score
      - backend
      - trace_id
      - created_at
      title: ModerationEventEntry
      description: 'One audit row as it appears in the ops tail.


        `content_hash` is the SHA-256 hex of the original request body

        (always 64 chars). Raw content is never returned — see

        `event_sink.py` for why: the audit log itself would otherwise

        become a red-line corpus the moment we hand it back over HTTP.


        `context`, `verdict`, `categories` reuse the user-facing Literals

        from `app.schemas.moderation` so a schema drift on either side

        surfaces in one place — the moderation pipeline and the audit

        surface stay aligned by construction.'
    ModerationEventsResponse:
      properties:
        since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
        until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Until
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: Echoes the user_id filter when one was applied. Null = unfiltered.
        verdict:
          anyOf:
          - type: string
            enum:
            - allow
            - warn
            - redirect
            - block
          - type: 'null'
          title: Verdict
          description: Echoes the verdict filter when one was applied. Null = unfiltered.
        limit:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Limit
        count:
          type: integer
          minimum: 0.0
          title: Count
        events:
          items:
            $ref: '#/components/schemas/ModerationEventEntry'
          type: array
          title: Events
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - since
      - until
      - limit
      - count
      - events
      - generated_at
      title: ModerationEventsResponse
      description: 'Page of recent moderation decisions, newest first.


        `since` / `until` / `user_id` / `verdict` echo the resolved

        filters so the renderer doesn''t have to re-derive them from the

        query string (and so a downstream cache key can be built off the

        response alone). `limit` is the cap the route applied; `count`

        is how many rows actually came back (≤ limit).'
    ModerationInterceptEvent:
      properties:
        verdict:
          type: string
          enum:
          - allow
          - warn
          - redirect
          - block
          title: Verdict
          description: Moderation verdict on the user input. `redirect` for crisis content.
          examples:
          - redirect
        categories:
          items:
            type: string
            enum:
            - self_harm
            - violence
            - loan
            - harassment
            - political
            - other
          type: array
          title: Categories
          description: Moderation categories the input tripped.
          examples:
          - - self_harm
        redirect_resource:
          anyOf:
          - $ref: '#/components/schemas/RedirectResource'
          - type: 'null'
          description: Crisis-line / help resource. Present when verdict == 'redirect'.
      type: object
      required:
      - verdict
      title: ModerationInterceptEvent
      description: 'Red-line interception frame (PRD §3.0.5).


        Emitted *instead of* a roleplay turn when the user input trips a

        `redirect` verdict — e.g. self-harm content force-interrupts the

        practice (§3.0.5 A) and surfaces a crisis-line resource. When this

        frame fires it is the ONLY frame in the stream: no opponent /

        coach / meta frames follow, and no turn is persisted.'
    ModerationStatsBreakdownEntry:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
        count:
          type: integer
          minimum: 0.0
          title: Count
      additionalProperties: false
      type: object
      required:
      - key
      - count
      title: ModerationStatsBreakdownEntry
      description: "One row in a by-verdict / by-context / by-category / by-backend\nbreakdown.\n\n`key`\
        \ is the grouping value:\n  * for `by_verdict`  — `allow` / `warn` / `redirect` / `block`\n  \
        \  (always present in this order, zero-counts included)\n  * for `by_context`  — `user_input`\
        \ / `ai_output` / `scenario_custom`\n  * for `by_category` — `self_harm` / `violence` / etc (only\n\
        \    categories actually triggered in the window)\n  * for `by_backend`  — `aliyun` / `local_dict`\
        \ / etc"
    ModerationStatsResponse:
      properties:
        since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
        until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Until
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: Echoes the user_id filter when one was applied. Null = unfiltered.
        totals:
          $ref: '#/components/schemas/ModerationStatsTotals'
        by_verdict:
          items:
            $ref: '#/components/schemas/ModerationStatsBreakdownEntry'
          type: array
          title: By Verdict
        by_context:
          items:
            $ref: '#/components/schemas/ModerationStatsBreakdownEntry'
          type: array
          title: By Context
        by_category:
          items:
            $ref: '#/components/schemas/ModerationStatsBreakdownEntry'
          type: array
          title: By Category
        by_backend:
          items:
            $ref: '#/components/schemas/ModerationStatsBreakdownEntry'
          type: array
          title: By Backend
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - since
      - until
      - totals
      - by_verdict
      - by_context
      - by_category
      - by_backend
      - generated_at
      title: ModerationStatsResponse
      description: 'Per-window moderation rate rollup.


        `by_verdict` is always 4 entries in the canonical

        (allow, warn, redirect, block) order — even when a verdict had

        zero events in the window. The other three breakdowns are sorted

        by count desc (most-frequent first) and only include keys that

        actually appeared.


        Category counts intentionally count each row once per category

        it carries — a row tagged `(self_harm, violence)` contributes to

        both buckets. The reading is "how often did category X fire",

        not "how many single-category rows existed".'
    ModerationStatsTotals:
      properties:
        event_count:
          type: integer
          minimum: 0.0
          title: Event Count
        allow_count:
          type: integer
          minimum: 0.0
          title: Allow Count
        warn_count:
          type: integer
          minimum: 0.0
          title: Warn Count
        redirect_count:
          type: integer
          minimum: 0.0
          title: Redirect Count
        block_count:
          type: integer
          minimum: 0.0
          title: Block Count
      additionalProperties: false
      type: object
      required:
      - event_count
      - allow_count
      - warn_count
      - redirect_count
      - block_count
      title: ModerationStatsTotals
      description: 'Headline counts across the window.


        Per-verdict counts are first-class fields (not a generic dict) so

        the response shape stays self-describing — an ops dashboard can

        type-check against the schema and know exactly which counters

        exist without iterating a map. `event_count` is the sum of the

        four verdict counts (and equals `len(events)` over the same window

        in /moderation-events).'
    OpponentDeltaEvent:
      properties:
        text:
          type: string
          title: Text
          description: Next token chunk. Concatenate in order to reconstruct the full reply.
          examples:
          - 什么
      type: object
      required:
      - text
      title: OpponentDeltaEvent
      description: Streaming token chunk from the opponent persona. Fired many times per turn.
    OpponentDoneEvent:
      properties:
        turn_id:
          type: string
          title: Turn Id
          description: Server-assigned turn id; use it when calling /sessions/{id}/end.
          examples:
          - t_018f3a8b1c2d7e3a
        full_text:
          type: string
          title: Full Text
          description: Complete opponent reply, equivalent to the concatenation of all deltas.
          examples:
          - 什么安排比工作还重要？
      type: object
      required:
      - turn_id
      - full_text
      title: OpponentDoneEvent
      description: Terminal event for the opponent reply. Fires exactly once per turn.
    PersonaCard:
      properties:
        id:
          type: string
          title: Id
          examples:
          - p_hard
        name:
          type: string
          title: Name
          description: The persona's name.
          examples:
          - 赵刚
        style:
          type: string
          title: Style
          description: Archetype label — one of the 4 fixed base personas.
          examples:
          - 强硬型
        age:
          type: integer
          minimum: 1.0
          title: Age
          description: The persona's age.
          examples:
          - 45
        avatar:
          type: string
          title: Avatar
          description: Avatar asset key the client maps to an image.
          examples:
          - persona-hard
        background:
          type: string
          title: Background
          description: One-line persona blurb shown on the picker card.
          examples:
          - 目标明确、节奏快，习惯用权威和数字压人，不爱绕弯子。
        difficulty:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Difficulty
          description: 1 = easy / 5 = hard. Drives 从易到难 ordering on the picker.
          examples:
          - 3
      type: object
      required:
      - id
      - name
      - style
      - age
      - avatar
      - background
      - difficulty
      title: PersonaCard
      description: 'One persona as rendered on the US-A2 picker card.


        Fields mirror PRD §10.2''s card spec (头像 / 名字 / 年龄 / 背景一句话)

        plus `difficulty` for easy → hard ordering. The internal

        `system_prompt` is deliberately absent.'
    PersonaListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PersonaCard'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Count of personas in `items`.
      type: object
      required:
      - items
      - total
      title: PersonaListResponse
      description: '`GET /v1/personas` — the 4 base opponent personas.'
    ReadinessCheck:
      properties:
        status:
          type: string
          enum:
          - ok
          - skipped
          - fail
          title: Status
        latency_ms:
          type: integer
          title: Latency Ms
          description: Wall-clock duration of the check, including network.
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Free-form context — for `fail` this is the error class; for `skipped` the reason
            (e.g. `asr_backend=dummy`); for `ok` the resolved backend type when there's more than one
            option.
      type: object
      required:
      - status
      - latency_ms
      title: ReadinessCheck
      description: One dependency's readiness state.
    ReadinessResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - degraded
          title: Status
        version:
          type: string
          title: Version
        env:
          type: string
          title: Env
        checks:
          additionalProperties:
            $ref: '#/components/schemas/ReadinessCheck'
          type: object
          title: Checks
      type: object
      required:
      - status
      - version
      - env
      - checks
      title: ReadinessResponse
      description: Aggregated readiness payload returned by `/health/ready`.
    RedirectResource:
      properties:
        title:
          type: string
          title: Title
          examples:
          - 心理援助 24h 热线
        url:
          type: string
          title: Url
          examples:
          - tel:010-82951332
      type: object
      required:
      - title
      - url
      title: RedirectResource
      description: Crisis-line / help resource surfaced when verdict == 'redirect' (PRD §3.0.5 A).
    ReviewSummaryResponse:
      properties:
        score:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Score
          examples:
          - 6.4
        top_failures:
          items:
            type: string
          type: array
          title: Top Failures
          description: At most 3 failure points distilled from the conversation.
          examples:
          - - 语气过冷
            - 未追问
        improvements:
          items:
            type: string
          type: array
          title: Improvements
          description: At most 3 actionable next-time-do-this suggestions.
          examples:
          - - 先认可再拒绝
            - 给一个替代时间
      type: object
      required:
      - score
      - top_failures
      - improvements
      title: ReviewSummaryResponse
      description: 'Whole-conversation summary. Null while `status == "processing"` and

        on `failed` uploads.'
    ReviewTurnResponse:
      properties:
        turn_idx:
          type: integer
          minimum: 0.0
          title: Turn Idx
          examples:
          - 0
        speaker:
          type: string
          enum:
          - user
          - opponent
          title: Speaker
          examples:
          - user
        content:
          type: string
          title: Content
          examples:
          - 有事，下次约。
        verdict:
          type: string
          enum:
          - win
          - neutral
          - lose
          title: Verdict
          examples:
          - lose
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why this user turn lost — populated on `lose` user turns only.
          examples:
          - 语气过冷，没有缓冲
        better:
          anyOf:
          - type: string
          - type: 'null'
          title: Better
          description: Suggested rewrite — populated on `lose` user turns only.
          examples:
          - 这周末确实排满了，下周二约可以吗？
      type: object
      required:
      - turn_idx
      - speaker
      - content
      - verdict
      title: ReviewTurnResponse
      description: 'One analysed turn — `reason` + `better` only on user `lose` turns

        per PRD §3.3 US-C2.'
    ReviewUploadResponse:
      properties:
        upload_id:
          type: string
          title: Upload Id
          examples:
          - up_018f3a8b1c2d7e3a
        status:
          type: string
          enum:
          - processing
          - done
          - failed
          title: Status
          examples:
          - done
        turns:
          items:
            $ref: '#/components/schemas/ReviewTurnResponse'
          type: array
          title: Turns
          description: Empty until analysis runs; on `failed` may also be empty.
        summary:
          anyOf:
          - $ref: '#/components/schemas/ReviewSummaryResponse'
          - type: 'null'
          description: Populated on `status == 'done'`; null otherwise.
        created_at:
          type: string
          format: date-time
          title: Created At
          examples:
          - '2026-05-16T10:00:00Z'
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          description: UTC timestamp when analysis finished; null while processing.
          examples:
          - '2026-05-16T10:00:02Z'
      type: object
      required:
      - upload_id
      - status
      - created_at
      title: ReviewUploadResponse
      description: '`GET /v1/review/uploads/{upload_id}` payload — full analysed record.


        `summary` is `null` when the upload is still processing OR the

        analysis failed. Frontend should always render the turn list (which

        is present even on failure as the parsed input lines, with all

        verdicts defaulting to neutral) and only render the summary card

        when `summary` is non-null.'
    ScenarioListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ScenarioSummary'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Total count across all pages, not just `items`.
      type: object
      required:
      - items
      - total
      title: ScenarioListResponse
    ScenarioSummary:
      properties:
        id:
          type: string
          title: Id
          examples:
          - sc_001
        title:
          type: string
          title: Title
          examples:
          - 周末加班谈判
        category:
          type: string
          enum:
          - campus
          - jobhunt
          - intern
          - life
          title: Category
          examples:
          - intern
        difficulty:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Difficulty
          description: 1 = easy / 5 = hard. Difficulty drives Persona aggression.
          examples:
          - 3
        tags:
          items:
            type: string
          type: array
          title: Tags
          examples:
          - - 拒绝
            - 上下级
        background:
          type: string
          title: Background
          description: Short scenario blurb shown in the picker card.
          examples:
          - 你刚结束周五的项目，老板在群里 @ 你...
        certification_count:
          type: integer
          minimum: 0.0
          title: Certification Count
