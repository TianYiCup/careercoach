openapi: 3.1.0
info:
  title: CareerCoach AI
  description: 中文语境对话练习教练 · 后端 API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Ready
      description: 'Run all dependency probes in parallel and aggregate.


        `asyncio.gather` is the right primitive here — a slow check

        shouldn''t serialize behind a fast one, and each check has its

        own timeout so the worst-case latency is bounded by

        `_READINESS_CHECK_TIMEOUT_S` (not the sum).'
      operationId: ready_health_ready_get
      responses:
        '200':
          description: All critical dependencies reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one critical dependency failed its probe. Body still returns the per-check
            breakdown so ops can see which dep is the problem without scraping logs.
  /v1/auth/sms/send:
    post:
      tags:
      - auth
      summary: Request an SMS verification code
      operationId: sms_send_v1_auth_sms_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
        '429':
          description: Per-phone rate limit fired. `code` is `SMS_SEND_COOLDOWN` for the send-after-send
            case and `SMS_VERIFY_LOCKED` for the 3-failure verify lock. The `Retry-After` header carries
            the seconds the client must wait.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/sms/verify:
    post:
      tags:
      - auth
      summary: Verify SMS code and mint a JWT
      operationId: sms_verify_v1_auth_sms_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsVerifyResponse'
        '400':
          description: Code expired, never sent, or does not match
        '429':
          description: Per-phone rate limit fired. `code` is `SMS_SEND_COOLDOWN` for the send-after-send
            case and `SMS_VERIFY_LOCKED` for the 3-failure verify lock. The `Retry-After` header carries
            the seconds the client must wait.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/me/birth-year:
    post:
      tags:
      - users
      summary: Set the caller's birth year and re-mint JWT with refreshed minor flag
      description: 'Server computes `is_minor` from `birth_year` and persists. The

        response carries a fresh JWT so the client''s old token (still

        carrying the previous `is_minor` value) can be discarded — no need

        to wait for the 30-day expiry to roll over.'
      operationId: update_birth_year_v1_users_me_birth_year_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBirthYearRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsVerifyResponse'
        '404':
          description: JWT subject no longer corresponds to a user (deleted account or stale token after
            a DB wipe).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/users/me/weaknesses:
    get:
      tags:
      - users
      summary: Get the caller's weakness profile + recommended training scenarios
      description: '弱点画像 (PRD §7.7 / US-C3). The weakness list is empty until the

        caller''s first scored session; `POST /v1/sessions/{id}/end` folds

        each session''s per-tag deltas in. Recommendations fall back to

        catalog scenarios — weakness-targeted matching is a follow-up.


        No age gate: reading a profile touches no LLM path. `user_id`

        comes from the JWT.'
      operationId: get_my_weaknesses_v1_users_me_weaknesses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaknessProfileResponse'
      security:
      - JWT: []
  /v1/scenarios:
    get:
      tags:
      - scenarios
      summary: List scenarios filtered by category and free-text query
      operationId: list_scenarios_v1_scenarios_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - campus
            - jobhunt
            - intern
            - life
            type: string
          - type: 'null'
          description: Optional category filter. Omit to get the homepage default mix.
          title: Category
        description: Optional category filter. Omit to get the homepage default mix.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Free-text search across title, tags, and background.
          title: Q
        description: Free-text search across title, tags, and background.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/scenarios/custom:
    post:
      tags:
      - scenarios
      summary: Generate a practisable scenario from a free-text description
      description: 'US-A1. The returned `scenario_id` is immediately usable as the

        `scenario_id` for `POST /v1/sessions`. v1 emits a templated

        placeholder script; LLM generation lands in a follow-up.


        The description is moderated (§3.0.5 D — 自定义场景必过审): a `block`

        or `redirect` verdict rejects it with a 400.'
      operationId: create_custom_scenario_v1_scenarios_custom_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomScenarioRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomScenarioResponse'
        '400':
          description: description blocked by content moderation (§3.0.5 D)
        '429':
          description: daily custom-scenario quota exceeded (PRD §7.12)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/sessions:
    post:
      tags:
      - sessions
      summary: Create a new sandbox session
      description: 'Starting a session means about to send user content into the

        LLM, so the compulsory age gate fires here. End-session is NOT

        gated — sessions already started must be end-able even if the

        user''s age claim somehow regresses.'
      operationId: create_session_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/sessions/{session_id}/turns:
    post:
      tags:
      - sessions
      summary: Submit a user turn and stream the opponent reply (SSE)
      description: 'Validate-then-stream: typed 4xx errors come back as normal HTTP

        responses (so the client''s fetch().catch() handler sees them); only

        once validation passes do we open the SSE stream.


        `current.is_minor` flows into the turn''s moderation check so the

        strict tier (PRD §3.0.5 C) fires for under-18 users — `warn` from

        the backend is elevated to a `block` verdict, which the route then

        surfaces as USER_INPUT_BLOCKED instead of letting an edge-case

        message through to the LLM.'
      operationId: post_turn_v1_sessions__session_id__turns_post
      security:
      - JWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session id from POST /v1/sessions.
          title: Session Id
        description: Session id from POST /v1/sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: Server-Sent Events stream. Each `data:` line is a JSON `SseEventEnvelope.frame`
            — a discriminated union over the five event types (`opponent.delta` / `opponent.done` / `coach.hint`
            / `meta` / `moderation`). Frontend should switch on `event` to pick the matching `data` shape.
            A `moderation` frame (PRD §3.0.5 red-line interception) is the sole frame in the stream when
            it fires. Wire example in PRD §7.4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SseEventEnvelope'
            text/event-stream: {}
        '400':
          description: user content blocked by content moderation
        '404':
          description: session not found
        '409':
          description: session already ended
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/voice:
    post:
      tags:
      - sessions
      summary: Submit a voice turn — transcribe, then stream the opponent reply (SSE)
      description: 'US-A3 voice turn. Transcribe the audio, then run the *identical*

        `/turns` pipeline on the transcript — the stream''s first frame is

        `user.transcribed`, the rest match a typed turn.


        The audio bytes are never persisted (CLAUDE.md constraint #2 —

        不存语音); only the transcript flows on, exactly like a typed reply.

        Validate-then-stream is preserved: ASR + the shared turn validation

        surface 4xx/5xx as normal HTTP responses before the SSE stream

        opens.'
      operationId: post_voice_turn_v1_sessions__session_id__voice_post
      security:
      - JWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session id from POST /v1/sessions.
          title: Session Id
        description: Session id from POST /v1/sessions.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_post_voice_turn_v1_sessions__session_id__voice_post'
      responses:
        '200':
          description: Server-Sent Events stream. Identical to POST /turns except the first frame is `user.transcribed`
            (the ASR transcript of the uploaded audio); the opponent / coach / meta / moderation frames
            that follow are the same `SseEventEnvelope.frame` discriminated union. Wire example in PRD
            §7.4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SseEventEnvelope'
            text/event-stream: {}
        '400':
          description: transcribed content blocked by content moderation
        '404':
          description: session not found
        '409':
          description: session already ended
        '413':
          description: audio upload exceeds the size limit
        '422':
          description: ASR produced an empty transcript (PRD US-A3 — 没听清)
        '502':
          description: ASR provider unavailable — fall back to a typed turn
  /v1/sessions/{session_id}/end:
    post:
      tags:
      - sessions
      summary: End a session and emit the scorecard + weakness deltas
      operationId: end_session_v1_sessions__session_id__end_post
      security:
      - JWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session id from POST /v1/sessions.
          title: Session Id
        description: Session id from POST /v1/sessions.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndSessionResponse'
        '404':
          description: session not found
        '409':
          description: session already ended
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/moderation/check:
    post:
      tags:
      - moderation
      summary: Synchronous content moderation gate
      operationId: moderation_check_v1_moderation_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/sharecards/session/{session_id}:
    post:
      tags:
      - sharecards
      summary: Render a 9:16 share card for a finished sandbox session
      description: '`is_minor` flows from the JWT so the caption-override moderation

        check uses the strict tier for under-18 users (PRD §3.0.5 C).

        The compulsory age gate fires first — sharing a card is committing

        to a public artifact, so we require the user to declare age before

        minting any sharecard.'
      operationId: create_session_card_v1_sharecards_session__session_id__post
      security:
      - JWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session id from POST /v1/sessions; must be in `ended` state.
          examples:
          - ses_018f3a8b1c2d7e3a
          title: Session Id
        description: Session id from POST /v1/sessions; must be in `ended` state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionShareCardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardResponse'
        '400':
          description: user_caption_override blocked by content moderation
        '404':
          description: session not found / no scorecard yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sharecards/weekly:
    post:
      tags:
      - sharecards
      summary: Render the weekly digest card (cron and on-demand both call this)
      operationId: create_weekly_card_v1_sharecards_weekly_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyShareCardRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/sharecards/wrapped/year/{year}:
    post:
      tags:
      - sharecards
      summary: Render the 6-page annual Wrapped recap
      operationId: create_wrapped_card_v1_sharecards_wrapped_year__year__post
      security:
      - JWT: []
      parameters:
      - name: year
        in: path
        required: true
        schema:
          type: integer
          maximum: 2099
          minimum: 2024
          description: Calendar year. Bounded to keep generated PNGs cacheable.
          examples:
          - 2026
          title: Year
        description: Calendar year. Bounded to keep generated PNGs cacheable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrappedShareCardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/copilot/sessions:
    post:
      tags:
      - copilot
      summary: Create a realtime copilot session
      description: 'Mint a copilot session row and return the WebSocket URL.


        No LLM call, no moderation in this handler — copilot is

        adult-only (gate-enforced) and the audio + transcript moderation

        runs in the WS handler against each `asr_final` (A-19). A-15

        persists the session intent so the WS endpoint can look it up

        on connect.'
      operationId: create_copilot_session_v1_copilot_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCopilotSessionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCopilotSessionResponse'
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: '`AGE_REQUIRED` if the JWT lacks `age_set=true`; `MINOR_FORBIDDEN` if the caller
            is under 18. PRD §1.5 / R-15.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/review/uploads:
    post:
      tags:
      - review
      summary: Upload a conversation transcript for review (sync analysis, text-only)
      description: 'Sync today: analyzes the transcript inside the request and

        returns `done` / `failed`. Full turns + summary live on the GET

        detail route — keeps the POST envelope identical to the A-8 lock

        so B''s generated client doesn''t churn.


        `current.is_minor` flows into the moderation cascade so the strict

        tier (PRD §3.0.5 C) fires for under-18 users — `warn` from the

        backend is elevated to a `block` verdict, which the route surfaces

        as USER_INPUT_BLOCKED instead of letting an edge-case message

        through to the LLM.'
      operationId: create_review_upload_v1_review_uploads_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewUploadResponse'
        '400':
          description: '`USER_INPUT_BLOCKED` — moderation flagged the uploaded text as red-line content
            (PRD §3.0.5). Body lists the categories.'
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: '`AGE_REQUIRED` if the JWT lacks `age_set=true` (PRD §1.5).'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/review/uploads/{upload_id}:
    get:
      tags:
      - review
      summary: Fetch the analysed review (turns + summary)
      description: 'Returns the canonical record. Cross-user access is silently

        folded into 404 — a probing client cannot tell "exists but not

        yours" apart from "does not exist".'
      operationId: get_review_upload_v1_review_uploads__upload_id__get
      security:
      - JWT: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          description: Upload id from POST /v1/review/uploads.
          title: Upload Id
        description: Upload id from POST /v1/review/uploads.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewUploadResponse'
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: '`AGE_REQUIRED` if the JWT lacks `age_set=true`.'
        '404':
          description: Upload does not exist or belongs to a different user.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ops/token-cost:
    get:
      tags:
      - ops
      summary: Per-user LLM token spend rollup over a fixed time window
      description: Aggregates `llm_calls` rows for one user across the requested window. Returns headline
        totals plus by-model and by-surface breakdowns, each sorted by `total_tokens` descending. `window=all`
        skips time bounds; otherwise the response's `since`/`until` echo the resolved bounds for cacheability.
      operationId: get_token_cost_v1_ops_token_cost_get
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          description: The user whose spend to roll up. Pass the literal `system` for non-user-attributed
            calls (cron, background).
          examples:
          - u_018f3a8b1c2d7e3a
          title: User Id
        description: The user whose spend to roll up. Pass the literal `system` for non-user-attributed
          calls (cron, background).
      - name: window
        in: query
        required: false
        schema:
          enum:
          - 1d
          - 7d
          - 30d
          - all
          type: string
          description: Time window for the rollup. `1d` / `7d` / `30d` are rolling windows ending at request
            time; `all` is unbounded.
          default: 7d
          title: Window
        description: Time window for the rollup. `1d` / `7d` / `30d` are rolling windows ending at request
          time; `all` is unbounded.
      - name: X-Ops-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Ops-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCostResponse'
        '401':
          description: missing or wrong X-Ops-Token header
        '503':
          description: ops endpoints disabled (OPS_API_TOKEN unset)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ops/moderation-events:
    get:
      tags:
      - ops
      summary: Recent moderation decisions (audit tail)
      description: Returns the most recent `moderation_events` rows, newest first. Filters compose (`user_id`,
        `verdict`, `since`, `until`); omit them for an unfiltered tail. Raw content is never returned
        — only the SHA-256 hash and length. The per-page cap is 500.
      operationId: list_moderation_events_v1_ops_moderation_events_get
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Filter to a single user. Omit for tenant-wide tail.
          examples:
          - u_018f3a8b1c2d7e3a
          title: User Id
        description: Filter to a single user. Omit for tenant-wide tail.
      - name: verdict
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - allow
            - warn
            - redirect
            - block
            type: string
          - type: 'null'
          description: Filter to one verdict (`allow` / `warn` / `redirect` / `block`). Omit to include
            every verdict.
          title: Verdict
        description: Filter to one verdict (`allow` / `warn` / `redirect` / `block`). Omit to include
          every verdict.
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive lower bound on `created_at`. ISO-8601, timezone-aware. Omit for no lower
            bound.
          title: Since
        description: Inclusive lower bound on `created_at`. ISO-8601, timezone-aware. Omit for no lower
          bound.
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Exclusive upper bound on `created_at` (half-open `[since, until)` matches the rollup
            window semantics). Omit for no upper bound.
          title: Until
        description: Exclusive upper bound on `created_at` (half-open `[since, until)` matches the rollup
          window semantics). Omit for no upper bound.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Per-page cap on rows returned. Default 50 (typical ops tail render); hard max 500.
          default: 50
