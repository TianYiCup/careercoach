      description: Returns N consecutive UTC-day buckets ending today (the today bucket is partial, with
        `until` set to request time). Days with no calls appear with zero totals so a chart line renders
        without gaps. The headline `totals` equals the sum across the daily buckets. Max `days` is 90.
