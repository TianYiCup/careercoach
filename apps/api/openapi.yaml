openapi: 3.1.0
info:
  title: CareerCoach AI
  description: 中文语境对话练习教练 · 后端 API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/auth/sms/send:
    post:
      tags:
      - auth
      summary: Request an SMS verification code
      operationId: sms_send_v1_auth_sms_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
        '429':
          description: Per-phone rate limit fired. `code` is `SMS_SEND_COOLDOWN` for the send-after-send
            case and `SMS_VERIFY_LOCKED` for the 3-failure verify lock. The `Retry-After` header carries
            the seconds the client must wait.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/sms/verify:
    post:
      tags:
      - auth
      summary: Verify SMS code and mint a JWT
      operationId: sms_verify_v1_auth_sms_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsVerifyResponse'
        '400':
          description: Code expired, never sent, or does not match
        '429':
          description: Per-phone rate limit fired. `code` is `SMS_SEND_COOLDOWN` for the send-after-send
            case and `SMS_VERIFY_LOCKED` for the 3-failure verify lock. The `Retry-After` header carries
            the seconds the client must wait.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/users/me/birth-year:
    post:
      tags:
      - users
      summary: Set the caller's birth year and re-mint JWT with refreshed minor flag
      description: 'Server computes `is_minor` from `birth_year` and persists. The

        response carries a fresh JWT so the client''s old token (still

        carrying the previous `is_minor` value) can be discarded — no need

        to wait for the 30-day expiry to roll over.'
      operationId: update_birth_year_v1_users_me_birth_year_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBirthYearRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsVerifyResponse'
        '404':
          description: JWT subject no longer corresponds to a user (deleted account or stale token after
            a DB wipe).
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/scenarios:
    get:
      tags:
      - scenarios
      summary: List scenarios filtered by category and free-text query
      operationId: list_scenarios_v1_scenarios_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - campus
            - jobhunt
            - intern
            - life
            type: string
          - type: 'null'
          description: Optional category filter. Omit to get the homepage default mix.
          title: Category
        description: Optional category filter. Omit to get the homepage default mix.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Free-text search across title, tags, and background.
          title: Q
        description: Free-text search across title, tags, and background.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions:
    post:
      tags:
      - sessions
      summary: Create a new sandbox session
      description: 'Starting a session means about to send user content into the

        LLM, so the compulsory age gate fires here. End-session is NOT

        gated — sessions already started must be end-able even if the

        user''s age claim somehow regresses.'
      operationId: create_session_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/sessions/{session_id}/turns:
    post:
      tags:
      - sessions
      summary: Submit a user turn and stream the opponent reply (SSE)
      description: 'Validate-then-stream: typed 4xx errors come back as normal HTTP

        responses (so the client''s fetch().catch() handler sees them); only

        once validation passes do we open the SSE stream.


        `current.is_minor` flows into the turn''s moderation check so the

        strict tier (PRD §3.0.5 C) fires for under-18 users — `warn` from

        the backend is elevated to a `block` verdict, which the route then

        surfaces as USER_INPUT_BLOCKED instead of letting an edge-case

        message through to the LLM.'
      operationId: post_turn_v1_sessions__session_id__turns_post
      security:
      - JWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session id from POST /v1/sessions.
          title: Session Id
        description: Session id from POST /v1/sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: Server-Sent Events stream. Each `data:` line is a JSON `SseEventEnvelope.frame`
            — a discriminated union over the four event types (`opponent.delta` / `opponent.done` / `coach.hint`
            / `meta`). Frontend should switch on `event` to pick the matching `data` shape. Wire example
            in PRD §7.4.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SseEventEnvelope'
            text/event-stream: {}
        '400':
          description: user content blocked by content moderation
        '404':
          description: session not found
        '409':
          description: session already ended
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/end:
    post:
      tags:
      - sessions
      summary: End a session and emit the scorecard + weakness deltas
      operationId: end_session_v1_sessions__session_id__end_post
      security:
      - JWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session id from POST /v1/sessions.
          title: Session Id
        description: Session id from POST /v1/sessions.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndSessionResponse'
        '404':
          description: session not found
        '409':
          description: session already ended
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/moderation/check:
    post:
      tags:
      - moderation
      summary: Synchronous content moderation gate
      operationId: moderation_check_v1_moderation_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/sharecards/session/{session_id}:
    post:
      tags:
      - sharecards
      summary: Render a 9:16 share card for a finished sandbox session
      description: '`is_minor` flows from the JWT so the caption-override moderation

        check uses the strict tier for under-18 users (PRD §3.0.5 C).

        The compulsory age gate fires first — sharing a card is committing

        to a public artifact, so we require the user to declare age before

        minting any sharecard.'
      operationId: create_session_card_v1_sharecards_session__session_id__post
      security:
      - JWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Session id from POST /v1/sessions; must be in `ended` state.
          examples:
          - ses_018f3a8b1c2d7e3a
          title: Session Id
        description: Session id from POST /v1/sessions; must be in `ended` state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionShareCardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardResponse'
        '400':
          description: user_caption_override blocked by content moderation
        '404':
          description: session not found / no scorecard yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sharecards/weekly:
    post:
      tags:
      - sharecards
      summary: Render the weekly digest card (cron and on-demand both call this)
      operationId: create_weekly_card_v1_sharecards_weekly_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyShareCardRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/sharecards/wrapped/year/{year}:
    post:
      tags:
      - sharecards
      summary: Render the 6-page annual Wrapped recap
      operationId: create_wrapped_card_v1_sharecards_wrapped_year__year__post
      security:
      - JWT: []
      parameters:
      - name: year
        in: path
        required: true
        schema:
          type: integer
          maximum: 2099
          minimum: 2024
          description: Calendar year. Bounded to keep generated PNGs cacheable.
          examples:
          - 2026
          title: Year
        description: Calendar year. Bounded to keep generated PNGs cacheable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrappedShareCardRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/copilot/sessions:
    post:
      tags:
      - copilot
      summary: Create a realtime copilot session
      description: 'Mint a copilot session row and return the WebSocket URL.


        No LLM call, no moderation in this handler — copilot is

        adult-only (gate-enforced) and the audio + transcript moderation

        will live in the WS handler once ASR lands. A-15 just persists

        the session intent so the WS endpoint can look it up on connect.'
      operationId: create_copilot_session_v1_copilot_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCopilotSessionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCopilotSessionResponse'
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: '`AGE_REQUIRED` if the JWT lacks `age_set=true`; `MINOR_FORBIDDEN` if the caller
            is under 18. PRD §1.5 / R-15.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/review/uploads:
    post:
      tags:
      - review
      summary: Upload a conversation transcript for review (sync analysis, text-only)
      description: 'Sync today: analyzes the transcript inside the request and

        returns `done` / `failed`. Full turns + summary live on the GET

        detail route — keeps the POST envelope identical to the A-8 lock

        so B''s generated client doesn''t churn.


        `current.is_minor` flows into the moderation cascade so the strict

        tier (PRD §3.0.5 C) fires for under-18 users — `warn` from the

        backend is elevated to a `block` verdict, which the route surfaces

        as USER_INPUT_BLOCKED instead of letting an edge-case message

        through to the LLM.'
      operationId: create_review_upload_v1_review_uploads_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewUploadResponse'
        '400':
          description: '`USER_INPUT_BLOCKED` — moderation flagged the uploaded text as red-line content
            (PRD §3.0.5). Body lists the categories.'
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: '`AGE_REQUIRED` if the JWT lacks `age_set=true` (PRD §1.5).'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWT: []
  /v1/review/uploads/{upload_id}:
    get:
      tags:
      - review
      summary: Fetch the analysed review (turns + summary)
      description: 'Returns the canonical record. Cross-user access is silently

        folded into 404 — a probing client cannot tell "exists but not

        yours" apart from "does not exist".'
      operationId: get_review_upload_v1_review_uploads__upload_id__get
      security:
      - JWT: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          description: Upload id from POST /v1/review/uploads.
          title: Upload Id
        description: Upload id from POST /v1/review/uploads.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewUploadResponse'
        '401':
          description: Missing or invalid bearer token.
        '403':
          description: '`AGE_REQUIRED` if the JWT lacks `age_set=true`.'
        '404':
          description: Upload does not exist or belongs to a different user.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CoachHintEvent:
      properties:
        safe:
          type: string
          title: Safe
          description: 稳如老狗 🐶 — low-risk reply.
          examples:
          - 可以反问 deadline，让对方先暴露底牌
        aggressive:
          type: string
          title: Aggressive
          description: 正面刚 🔥 — direct push-back.
          examples:
          - 直接质疑加班合理性
        humor:
          type: string
          title: Humor
          description: 整活儿 🤡 — humor / deflection.
          examples:
          - 用 '离婚' 当借口
      type: object
      required:
      - safe
      - aggressive
      - humor
      title: CoachHintEvent
      description: 'Three-tier coach suggestions surfaced after the opponent finishes (design-spec §6).


        All three tiers are returned together so the UI can render the HintCardV2

        pill switcher without an extra round-trip.'
    CreateCopilotSessionRequest:
      properties:
        scenario_hint:
          type: string
          maxLength: 200
          minLength: 1
          title: Scenario Hint
          description: Free-text scenario hint, e.g. '面试谈薪'.
          examples:
          - 面试谈薪
        privacy_level:
          type: string
          enum:
          - standard
          - high
          title: Privacy Level
          description: '`high` enables on-device ASR + redaction (US-B3, v2). v0.1 accepts the field but
            does not act on it.'
          default: standard
          examples:
          - high
      type: object
      required:
      - scenario_hint
      title: CreateCopilotSessionRequest
      description: 'Mirrors PRD §7.5 — `{ "scenario_hint": "...", "privacy_level": "..." }`.


        `privacy_level=high` is the future on-device-ASR + redaction path

        (US-B3). v0.1 only validates the shape; the handler returns 501.'
    CreateCopilotSessionResponse:
      properties:
        copilot_id:
          type: string
          title: Copilot Id
          examples:
          - cop_018f3a8b1c2d7e3a
        ws_url:
          type: string
          title: Ws Url
          description: WebSocket URL the client connects to for audio chunks + hints. v0.1 placeholder
            — v1 will use SSE over the same scheme.
          examples:
          - wss://realtime.careercoach.ai/copilot/cop_018f3a8b1c2d7e3a
      type: object
      required:
      - copilot_id
      - ws_url
      title: CreateCopilotSessionResponse
      description: 'Placeholder so OpenAPI''s 200 row points at a real schema. The

        v0.1 stub never returns 200 — the handler raises 501 — but the

        type is locked here so B''s codegen can already stub a client.'
    CreateReviewUploadRequest:
      properties:
        text:
          type: string
          maxLength: 5000
          minLength: 1
          title: Text
          description: Conversation transcript pasted as text. PRD §3.3 caps at 5000 chars; longer payloads
            are 422.
          examples:
          - '对方：你周末有空吗？

            我：有事，下次约。'
      type: object
      required:
      - text
      title: CreateReviewUploadRequest
      description: 'Text-only review upload — PRD §3.3 US-C1 L4 (5000 字 ≤ 2s).


        v0.1 intentionally has no `images` / `audio` fields. Adding those

        on the v2 multipart path is a separate route operation, not an

        extension of this body — keeping JSON-only here lets B keep the

        `apiClient.post()` codepath instead of branching to FormData.'
    CreateReviewUploadResponse:
      properties:
        upload_id:
          type: string
          title: Upload Id
          examples:
          - up_018f3a8b1c2d7e3a
        status:
          type: string
          enum:
          - processing
          - done
          - failed
          title: Status
          description: Analysis state. Today's sync flow returns `done` or `failed` directly. `processing`
            is reserved for the future async path.
          examples:
          - done
      type: object
      required:
      - upload_id
      - status
      title: CreateReviewUploadResponse
      description: 'POST response — minimal envelope; full record lives on the GET route.


        `status` reflects the synchronous analysis outcome (v0 today blocks

        on the LLM call). When the queue handoff lands (A-13+), this will

        return `processing` immediately and the client polls the GET route.

        The shape stays identical so B''s client doesn''t churn.'
    CreateSessionRequest:
      properties:
        mode:
          type: string
          enum:
          - sandbox
          - copilot
          - review
          title: Mode
          description: v0.1 only ships sandbox.
          examples:
          - sandbox
        scenario_id:
          type: string
          title: Scenario Id
          examples:
          - sc_001
        persona_id:
          type: string
          title: Persona Id
          examples:
          - p_hard
        user_goal:
          type: string
          maxLength: 200
          title: User Goal
          description: What the user wants to achieve in this practice round.
          examples:
          - 保住周末，不得罪老板
      type: object
      required:
      - mode
      - scenario_id
      - persona_id
      - user_goal
      title: CreateSessionRequest
    CreateSessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          examples:
          - ses_018f3a8b1c2d7e3a
        opening_line:
          type: string
          title: Opening Line
          description: Opponent's first line, generated server-side from scenario + persona.
          examples:
          - 小林啊，这个周末项目得加个班，应该没问题吧？
      type: object
      required:
      - session_id
      - opening_line
      title: CreateSessionResponse
    EndSessionResponse:
      properties:
        score:
          $ref: '#/components/schemas/Score'
        weakness_updates:
          items:
            $ref: '#/components/schemas/WeaknessUpdate'
          type: array
          title: Weakness Updates
      type: object
      required:
      - score
      title: EndSessionResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        env:
          type: string
          title: Env
      type: object
      required:
      - status
      - version
      - env
      title: HealthResponse
    MetaEvent:
      properties:
        turns_used:
          type: integer
          minimum: 0.0
          title: Turns Used
          examples:
          - 5
        turns_left:
          type: integer
          minimum: 0.0
          title: Turns Left
          examples:
          - 25
      type: object
      required:
      - turns_used
      - turns_left
      title: MetaEvent
      description: Quota / meter update. Fires after each turn so the UI can re-render the counter.
    ModerationCheckRequest:
      properties:
        content:
          type: string
          maxLength: 8000
          minLength: 1
          title: Content
          description: Raw text to score. Caller MUST NOT pre-filter — moderation owns the decision.
        context:
          type: string
          enum:
          - user_input
          - ai_output
          - scenario_custom
          title: Context
          description: Where the content came from. Drives different sensitivity tables.
          examples:
          - user_input
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Optional — present when content is part of a Session/Turn.
      type: object
      required:
      - content
      - context
      title: ModerationCheckRequest
    ModerationCheckResponse:
      properties:
        verdict:
          type: string
          enum:
          - allow
          - warn
          - redirect
          - block
          title: Verdict
          description: allow = pass / warn = soft notice / redirect = surface resource / block = stop.
        categories:
          items:
            type: string
            enum:
            - self_harm
            - violence
            - loan
            - harassment
            - political
            - other
          type: array
          title: Categories
          description: Categories triggered. Empty when verdict == 'allow'.
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          description: Confidence in [0,1]. Higher = more sure the content is unsafe.
        redirect_resource:
          anyOf:
          - $ref: '#/components/schemas/RedirectResource'
          - type: 'null'
          description: Present iff verdict == 'redirect'. Null otherwise.
        trace_id:
          type: string
          title: Trace Id
          description: Echoes the request trace id for log correlation.
      type: object
      required:
      - verdict
      - score
      - trace_id
      title: ModerationCheckResponse
    OpponentDeltaEvent:
      properties:
        text:
          type: string
          title: Text
          description: Next token chunk. Concatenate in order to reconstruct the full reply.
          examples:
          - 什么
      type: object
      required:
      - text
      title: OpponentDeltaEvent
      description: Streaming token chunk from the opponent persona. Fired many times per turn.
    OpponentDoneEvent:
      properties:
        turn_id:
          type: string
          title: Turn Id
          description: Server-assigned turn id; use it when calling /sessions/{id}/end.
          examples:
          - t_018f3a8b1c2d7e3a
        full_text:
          type: string
          title: Full Text
          description: Complete opponent reply, equivalent to the concatenation of all deltas.
          examples:
          - 什么安排比工作还重要？
      type: object
      required:
      - turn_id
      - full_text
      title: OpponentDoneEvent
      description: Terminal event for the opponent reply. Fires exactly once per turn.
    RedirectResource:
      properties:
        title:
          type: string
          title: Title
          examples:
          - 心理援助 24h 热线
        url:
          type: string
          title: Url
          examples:
          - tel:010-82951332
      type: object
      required:
      - title
      - url
      title: RedirectResource
      description: Crisis-line / help resource surfaced when verdict == 'redirect' (PRD §3.0.5 A).
    ReviewSummaryResponse:
      properties:
        score:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Score
          examples:
          - 6.4
        top_failures:
          items:
            type: string
          type: array
          title: Top Failures
          description: At most 3 failure points distilled from the conversation.
          examples:
          - - 语气过冷
            - 未追问
        improvements:
          items:
            type: string
          type: array
          title: Improvements
          description: At most 3 actionable next-time-do-this suggestions.
          examples:
          - - 先认可再拒绝
            - 给一个替代时间
      type: object
      required:
      - score
      - top_failures
      - improvements
      title: ReviewSummaryResponse
      description: 'Whole-conversation summary. Null while `status == "processing"` and

        on `failed` uploads.'
    ReviewTurnResponse:
      properties:
        turn_idx:
          type: integer
          minimum: 0.0
          title: Turn Idx
          examples:
          - 0
        speaker:
          type: string
          enum:
          - user
          - opponent
          title: Speaker
          examples:
          - user
        content:
          type: string
          title: Content
          examples:
          - 有事，下次约。
        verdict:
          type: string
          enum:
          - win
          - neutral
          - lose
          title: Verdict
          examples:
          - lose
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why this user turn lost — populated on `lose` user turns only.
          examples:
          - 语气过冷，没有缓冲
        better:
          anyOf:
          - type: string
          - type: 'null'
          title: Better
          description: Suggested rewrite — populated on `lose` user turns only.
          examples:
          - 这周末确实排满了，下周二约可以吗？
      type: object
      required:
      - turn_idx
      - speaker
      - content
      - verdict
      title: ReviewTurnResponse
      description: 'One analysed turn — `reason` + `better` only on user `lose` turns

        per PRD §3.3 US-C2.'
    ReviewUploadResponse:
      properties:
        upload_id:
          type: string
          title: Upload Id
          examples:
          - up_018f3a8b1c2d7e3a
        status:
          type: string
          enum:
          - processing
          - done
          - failed
          title: Status
          examples:
          - done
        turns:
          items:
            $ref: '#/components/schemas/ReviewTurnResponse'
          type: array
          title: Turns
          description: Empty until analysis runs; on `failed` may also be empty.
        summary:
          anyOf:
          - $ref: '#/components/schemas/ReviewSummaryResponse'
          - type: 'null'
          description: Populated on `status == 'done'`; null otherwise.
        created_at:
          type: string
          format: date-time
          title: Created At
          examples:
          - '2026-05-16T10:00:00Z'
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          description: UTC timestamp when analysis finished; null while processing.
          examples:
          - '2026-05-16T10:00:02Z'
      type: object
      required:
      - upload_id
      - status
      - created_at
      title: ReviewUploadResponse
      description: '`GET /v1/review/uploads/{upload_id}` payload — full analysed record.


        `summary` is `null` when the upload is still processing OR the

        analysis failed. Frontend should always render the turn list (which

        is present even on failure as the parsed input lines, with all

        verdicts defaulting to neutral) and only render the summary card

        when `summary` is non-null.'
    ScenarioListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ScenarioSummary'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Total count across all pages, not just `items`.
      type: object
      required:
      - items
      - total
      title: ScenarioListResponse
    ScenarioSummary:
      properties:
        id:
          type: string
          title: Id
          examples:
          - sc_001
        title:
          type: string
          title: Title
          examples:
          - 周末加班谈判
        category:
          type: string
          enum:
          - campus
          - jobhunt
          - intern
          - life
          title: Category
          examples:
          - intern
        difficulty:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Difficulty
          description: 1 = easy / 5 = hard. Difficulty drives Persona aggression.
          examples:
          - 3
        tags:
          items:
            type: string
          type: array
          title: Tags
          examples:
          - - 拒绝
            - 上下级
        background:
          type: string
          title: Background
          description: Short scenario blurb shown in the picker card.
          examples:
          - 你刚结束周五的项目，老板在群里 @ 你...
        real_user_certified:
          type: boolean
          title: Real User Certified
          description: True only if ≥ 5 real students validated this scenario (PRD §3.0.5 D).
          examples:
          - true
      type: object
      required:
      - id
      - title
      - category
      - difficulty
      - background
      - real_user_certified
      title: ScenarioSummary
    Score:
      properties:
        aura:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Aura
          description: 气场 / presence.
        logic:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Logic
        emotion:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Emotion
          description: Emotional regulation.
        professionalism:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Professionalism
        goal_achieve:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Goal Achieve
          description: How close user got to user_goal.
        highlights:
          type: string
          title: Highlights
          description: K's praise — what the user nailed.
        failures:
          type: string
          title: Failures
          description: K's call-outs — where the user slipped.
        result:
          type: string
          enum:
          - shenfeng
          - guolu
          - fanche
          title: Result
          description: 封神 ≥ 8 / 路过 5–7 / 翻车 < 5. Drives Mascot expression and ShareCard gradient.
          examples:
          - guolu
      type: object
      required:
      - aura
      - logic
      - emotion
      - professionalism
      - goal_achieve
      - highlights
      - failures
      - result
      title: Score
      description: Per-session scorecard, returned on POST /v1/sessions/{id}/end.
    SessionShareCardRequest:
      properties:
        include_qrcode:
          type: boolean
          title: Include Qrcode
          description: Render the bottom-right QR code that deep-links back to the app. Defaults to false
            — many users prefer screenshot-clean cards.
          default: false
        user_caption_override:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: User Caption Override
          description: Optional user-edited one-liner replacing K's default verdict copy. Server still
            re-runs moderation (§7.8) before baking it into the PNG.
          examples:
          - 今天嘴硬了一把
      type: object
      title: SessionShareCardRequest
      description: 'Body of POST /v1/sharecards/session/{session_id}.


        `session_id` itself rides in the URL path so frontend can use

        `useShareCardForSession(id)` patterns without juggling bodies.'
    ShareCardResponse:
      properties:
        card_id:
          type: string
          title: Card Id
          description: Stable opaque id, also used as the storage object key. Prefix `card_` — distinct
            from `sc_` scenario ids and `ses_` session ids so log grep is unambiguous.
          examples:
          - card_018f3a8b1c2d7e3a
        type:
          type: string
          enum:
          - session
          - weekly
          - wrapped
          title: Type
        png_url:
          type: string
          title: Png Url
          description: 1080×1920 PNG URL. Presigned — frontend should re-request the card if the URL has
            expired. For `wrapped` this URL equals `pages[0]` and is the cover used by share-preview cards
            (OG / WeChat).
          examples:
          - https://cdn.example.com/sharecards/card_018f3a8b1c2d7e3a.png
        pages:
          items:
            type: string
          type: array
          title: Pages
          description: All pages in display order. Empty for `session` and `weekly`; for `wrapped` contains
            6 URLs where `pages[0]` IS the cover and equals `png_url` — frontend should render `pages`
            only and not show the cover twice.
          examples:
          - - https://cdn.example.com/sharecards/card_xxx/p0_cover.png
            - https://cdn.example.com/sharecards/card_xxx/p1_count.png
            - https://cdn.example.com/sharecards/card_xxx/p2_opponent.png
            - https://cdn.example.com/sharecards/card_xxx/p3_shenfeng.png
            - https://cdn.example.com/sharecards/card_xxx/p4_fanche.png
            - https://cdn.example.com/sharecards/card_xxx/p5_letter.png
        share_links:
          $ref: '#/components/schemas/ShareLinks'
        generated_at:
          type: string
          format: date-time
          title: Generated At
          description: UTC timestamp at which the PNG was rendered.
          examples:
          - '2026-05-12T13:45:00Z'
      type: object
      required:
      - card_id
      - type
      - png_url
      - share_links
      - generated_at
      title: ShareCardResponse
      description: '200 response shared by all three POSTs.


        A `wrapped` card carries 6 PNGs (one per page); `png_url` always

        points at `pages[0]` (the cover, which doubles as the OG share

        preview). For `session` / `weekly` the card is a single image and

        `pages` is empty.'
    ShareLinks:
      properties:
        wechat:
          type: string
          title: Wechat
          description: WeChat share deep link (weixin://...). Frontend opens via wx-sdk.
          examples:
          - weixin://dl/share?card=card_018f3a8b1c2d7e3a
        xiaohongshu:
          type: string
          title: Xiaohongshu
          description: Xiaohongshu share intent URL.
          examples:
          - https://www.xiaohongshu.com/share?img=card_018f3a8b1c2d7e3a
        save_local:
          type: string
          title: Save Local
          description: Direct PNG URL for save-to-album. Same origin as `png_url`.
          examples:
          - https://cdn.example.com/sharecards/card_018f3a8b1c2d7e3a.png
      type: object
      required:
      - wechat
      - xiaohongshu
      - save_local
      title: ShareLinks
      description: 'One-tap targets we render under the saved card.


        `save_local` is the raw PNG URL the client uses to drop the image

        into the user''s photo roll. `wechat` / `xiaohongshu` are deep-link

        URIs that pre-fill platform share sheets — they may carry a short

        UTM tag so analytics can attribute virality, but they MUST NOT

        leak PII (user_id, phone, etc.).'
    SmsSendRequest:
      properties:
        phone:
          type: string
          pattern: ^1[3-9]\d{9}$
          title: Phone
          description: Mainland China mobile number, 11 digits, no country prefix.
          examples:
          - '13800138000'
      type: object
      required:
      - phone
      title: SmsSendRequest
    SmsSendResponse:
      properties:
        ttl:
          type: integer
          minimum: 1.0
          title: Ttl
          description: Seconds until the user may request another code. Hardcoded 60s in v0.1.
          examples:
          - 60
      type: object
      required:
      - ttl
      title: SmsSendResponse
    SmsVerifyRequest:
      properties:
        phone:
          type: string
          pattern: ^1[3-9]\d{9}$
          title: Phone
          examples:
          - '13800138000'
        code:
          type: string
          pattern: ^\d{6}$
          title: Code
          description: 6-digit verification code received by SMS.
          examples:
          - '123456'
      type: object
      required:
      - phone
      - code
      title: SmsVerifyRequest
    SmsVerifyResponse:
      properties:
        token:
          type: string
          title: Token
          description: 'JWT bearer token. Pass as `Authorization: Bearer <token>`.'
          examples:
          - eyJhbGciOiJIUzI1NiJ9...
        user:
          $ref: '#/components/schemas/UserPublic'
      type: object
      required:
      - token
      - user
      title: SmsVerifyResponse
    SseEventEnvelope:
      properties:
        frame:
          oneOf:
          - $ref: '#/components/schemas/_OpponentDeltaFrame'
          - $ref: '#/components/schemas/_OpponentDoneFrame'
          - $ref: '#/components/schemas/_CoachHintFrame'
          - $ref: '#/components/schemas/_MetaFrame'
          title: Frame
          description: One frame of the /sessions/{id}/turns SSE stream. The `event` tag selects the matching
            `data` shape.
          discriminator:
            propertyName: event
            mapping:
              coach.hint: '#/components/schemas/_CoachHintFrame'
              meta: '#/components/schemas/_MetaFrame'
              opponent.delta: '#/components/schemas/_OpponentDeltaFrame'
              opponent.done: '#/components/schemas/_OpponentDoneFrame'
      type: object
      required:
      - frame
      title: SseEventEnvelope
      description: Wrapper that lets FastAPI register `SseEventFrame` in components/schemas.
    TurnRequest:
      properties:
        content:
          type: string
          maxLength: 2000
          minLength: 1
          title: Content
          description: User's reply text. Server runs moderation BEFORE forwarding to LLM.
          examples:
          - 赵总，我周末有重要安排
      type: object
      required:
      - content
      title: TurnRequest
      description: Body for POST /v1/sessions/{id}/turns. Response is SSE — see route description.
    UpdateBirthYearRequest:
      properties:
        birth_year:
          type: integer
          maximum: 2100.0
          minimum: 1900.0
          title: Birth Year
          description: Year of birth as a 4-digit integer. Server derives `is_minor` from this; the client
            cannot self-declare it.
          examples:
          - 2003
      type: object
      required:
      - birth_year
      title: UpdateBirthYearRequest
      description: 'Set the caller''s birth year for the minor-mode gate (PRD §1.5).


        We collect year only (minimal PII) — a mid-year proxy is enough

        for the `<18` decision. Static bounds catch gross typos

        (`99999`, `0`); years beyond the current year are accepted and

        land the caller on the strict tier (`compute_is_minor` returns

        True for negative ages — fail-closed).'
    UserPublic:
      properties:
        id:
          type: string
          title: Id
          description: UUID.
          examples:
          - u_018f3a8b-1c2d-7e3a-b4f5-6c7d8e9f0a1b
        nickname:
          type: string
          title: Nickname
          examples:
          - 小苏
        persona_type:
          type: string
          enum:
          - in_school
          - intern
          - graduate
          title: Persona Type
          examples:
          - in_school
        is_minor:
          type: boolean
          title: Is Minor
          description: True if user.birthdate puts them under 18 — triggers minor mode (PRD §3.0.5 C).
          examples:
          - false
      type: object
      required:
      - id
      - nickname
      - persona_type
      - is_minor
      title: UserPublic
      description: Fields safe to surface to the client. Never include `phone` raw — masked.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WeaknessUpdate:
      properties:
        tag:
          type: string
          title: Tag
          examples:
          - 过早让步
        delta:
          type: integer
          title: Delta
          description: Frequency delta from this session. Negative = improved.
          examples:
          - 1
      type: object
      required:
      - tag
      - delta
      title: WeaknessUpdate
    WeeklyShareCardRequest:
      properties:
        include_qrcode:
          type: boolean
          title: Include Qrcode
          description: Weekly is opt-in viral — most users glance and dismiss; Wrapped defaults the QR
            ON because that card is built to share. Flip this to true to surface the QR for users who
            do want to share.
          default: false
        week_offset:
          type: integer
          maximum: 0.0
          minimum: -12.0
          title: Week Offset
          description: 0 = the immediately preceding ISO calendar week (Mon-Sun in `Asia/Shanghai`). -1
            = the week before that, and so on, down to -12. Bounded so users can't backfill the whole
            year via this endpoint.
          default: 0
          examples:
          - 0
      type: object
      title: WeeklyShareCardRequest
      description: Body of POST /v1/sharecards/weekly. Manual trigger; cron also calls this.
    WrappedShareCardRequest:
      properties:
        include_qrcode:
          type: boolean
          title: Include Qrcode
          description: Wrapped defaults to on — virality matters.
          default: true
      type: object
      title: WrappedShareCardRequest
      description: 'Body of POST /v1/sharecards/wrapped/year/{year}.


        The year lives in the URL — body carries cosmetic toggles only.

        Empty-by-design today; if the field set grows post-v0.1 we''ll keep

        backward compatibility by adding only optional fields.'
    _CoachHintFrame:
      properties:
        event:
          type: string
          const: coach.hint
          title: Event
          default: coach.hint
        data:
          $ref: '#/components/schemas/CoachHintEvent'
      type: object
      required:
      - data
      title: _CoachHintFrame
    _MetaFrame:
      properties:
        event:
          type: string
          const: meta
          title: Event
          default: meta
        data:
          $ref: '#/components/schemas/MetaEvent'
      type: object
      required:
      - data
      title: _MetaFrame
    _OpponentDeltaFrame:
      properties:
        event:
          type: string
          const: opponent.delta
          title: Event
          default: opponent.delta
        data:
          $ref: '#/components/schemas/OpponentDeltaEvent'
      type: object
      required:
      - data
      title: _OpponentDeltaFrame
    _OpponentDoneFrame:
      properties:
        event:
          type: string
          const: opponent.done
          title: Event
          default: opponent.done
        data:
          $ref: '#/components/schemas/OpponentDoneEvent'
      type: object
      required:
      - data
      title: _OpponentDoneFrame
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
