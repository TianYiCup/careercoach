      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive lower bound on `created_at`. ISO-8601, timezone-aware.
          title: Since
        description: Inclusive lower bound on `created_at`. ISO-8601, timezone-aware.
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Exclusive upper bound on `created_at` (half-open `[since, until)` matches the rollup
            window semantics).
          title: Until
        description: Exclusive upper bound on `created_at` (half-open `[since, until)` matches the rollup
          window semantics).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Per-page cap on rows returned. Default 50 (typical ops tail render); hard max 500.
