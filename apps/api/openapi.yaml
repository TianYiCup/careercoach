        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/vibe/today:
    post:
      tags:
      - vibe
      summary: Record the caller's mood for today
      description: 'One check-in per Asia/Shanghai day — a re-POST overwrites it.

        `user_id` comes from the JWT, never the request body.'
      operationId: set_today_vibe_v1_vibe_today_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVibeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
