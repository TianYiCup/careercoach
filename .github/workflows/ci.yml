name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 始终跑：基础闸门（PR 必过）
  # ============================================================
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          ADDED=$(git diff --shortstat origin/main..HEAD | awk '{added += $4 + $6} END {print added+0}')
          echo "Lines changed: $ADDED"
          if [ "$ADDED" -ge 1500 ]; then
            echo "::error::PR > 1500 lines, please split"
            exit 1
          fi
          if [ "$ADDED" -ge 800 ]; then
            echo "::warning::PR > 800 lines, consider splitting"
          fi
          echo "✅ PR size OK"

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19
      - name: Validate commits
        run: |
          npx commitlint \
            --from origin/main \
            --to HEAD \
            --verbose

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: |
          yamllint -d '{rules: {line-length: {max: 300}, document-start: disable, truthy: {check-keys: false}}}' .github/

  # ============================================================
  # 条件跑：apps/api 存在时
  # ============================================================
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if api exists
        id: check
        run: |
          if [ -f apps/api/pyproject.toml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: astral-sh/setup-uv@v3
        if: steps.check.outputs.exists == 'true'
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        run: uv sync --frozen
      - name: Ruff lint
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        run: uv run ruff check .
      - name: Ruff format check
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        run: uv run ruff format --check .
      - name: Skip notice
        if: steps.check.outputs.exists == 'false'
        run: echo "::notice::apps/api 还没初始化，跳过 lint"

  # ============================================================
  # 条件跑：apps/web 存在时
  # ============================================================
  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: pnpm --filter web lint
      - name: Type check
        if: steps.check.outputs.exists == 'true'
        run: pnpm --filter web typecheck
      - name: Skip notice
        if: steps.check.outputs.exists == 'false'
        run: echo "::notice::apps/web 还没初始化，跳过 lint"

  # ============================================================
  # 条件跑：apps/wxapp 存在时
  # ============================================================
  lint-wxapp:
    name: Lint Wxapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/wxapp/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: pnpm --filter wxapp lint
      - name: Skip notice
        if: steps.check.outputs.exists == 'false'
        run: echo "::notice::apps/wxapp 还没初始化，跳过 lint"

  # ============================================================
  # 条件跑：apps/api 存在时跑 pytest（含 PG 集成）
  # ============================================================
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    # GitHub Actions service container — runs alongside the job and is
    # reachable at localhost:5432 because we map the port. Image + creds
    # match docker-compose.yml so the default `database_url` in settings
    # works without override.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careercoach
        ports:
          - 5432:5432
        # Without --health-cmd the runner won't wait for "select 1" to
        # work before kicking off the job, so tests can hit a not-yet-
        # listening postgres and degrade to the skip path silently.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/api/pyproject.toml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: astral-sh/setup-uv@v3
        if: steps.check.outputs.exists == 'true'
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        run: uv sync --frozen
      - name: Alembic upgrade
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        # Creates every table the integration tests assume. Without
        # this step the `@pytest.mark.integration` tests would fail at
        # first INSERT instead of running against an empty schema.
        run: uv run --frozen alembic upgrade head
      - name: Pytest
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        # `--strict-markers` keeps a typo'd @pytest.mark.* from silently
        # passing. PG is reachable here, so integration tests run; the
        # aliyun-creds-only test still skips.
        run: uv run --frozen pytest -q --strict-markers
      - name: Skip notice
        if: steps.check.outputs.exists == 'false'
        run: echo "::notice::apps/api 还没初始化，跳过 pytest"

  # ============================================================
  # 条件跑：apps/web 存在时跑 vitest
  # ============================================================
  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - name: Vitest
        if: steps.check.outputs.exists == 'true'
        run: pnpm --filter web test
      - name: Skip notice
        if: steps.check.outputs.exists == 'false'
        run: echo "::notice::apps/web 还没初始化，跳过 vitest"

  # ============================================================
  # 红线闸门：§3.0.5 200 对抗样本回归（独立命名 job）
  # ============================================================
  # The 200-sample moderation regression also runs inside `test-api`
  # as one of the pytest suite. This job names it as a first-class
  # gate so a red-line recall regression shows as "Red-line ..." ❌
  # rather than hiding in a generic "Test API" ❌ among 800+ tests —
  # and so it can be added to branch protection's required-checks
  # list explicitly (engineering §3.2 / §3.4). Pure local-dict eval —
  # no DB / Redis services, ~1s.
  red-line-test:
    name: Red-line 200 Adversarial Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/api/pyproject.toml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: astral-sh/setup-uv@v3
        if: steps.check.outputs.exists == 'true'
      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        run: uv sync --frozen
      - name: Red-line regression (§3.0.5 — recall ≥ 99.5% / FP ≤ 3%)
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/api
        run: uv run --frozen pytest -q --strict-markers tests/test_moderation_regression.py
      - name: Skip notice
        if: steps.check.outputs.exists == 'false'
        run: echo "::notice::apps/api 还没初始化，跳过红线回归"

  # ============================================================
  # TODO（B 端 / 运维决策后启用）
  # ============================================================
  # build-web:      产物 ≤ 2MB — B 端 (apps/web)
  # build-wxapp:    主包 ≤ 1.5MB（约束 #13）— B 端 (apps/wxapp)，
  #                 启用前需 B 端确认 wxapp 能干净构建，否则会卡死所有 PR
  #
  # llm-regression 已落地为独立 workflow（.github/workflows/llm-regression.yml）
  # 跑 nightly + workflow_dispatch；PR 时跑 offline 数据集闸
  # （tests/test_llm_regression_data.py，已含在 test-api job 里）。
  # 详见 docs/llm-regression.md。
